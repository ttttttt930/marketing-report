<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="2eEqDof3NbxmuUOQNV1kPZ">
<head data-page-node-id="FxCBEIxD5ZQE6Hku6CWbpZ">
<meta charset="UTF-8" data-page-node-id="A2eQJ7jMM08P8oQouIpToj">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="V4aGUkYaMKm2YtFleZMs9f">
<title>时法营销看板</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --line:#e6e9f2; --ink:#1f2430; --ink2:#5b6472;
  --ink3:#9aa3b2; --accent:#4f6ef7; --accent-weak:#eef1fe;
  --up:#d5384a; --down:#1e9e62; --warn:#c77c1a;
  --radius:12px; --shadow:0 1px 3px rgba(23,32,64,.06),0 4px 16px rgba(23,32,64,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;}
.app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{width:212px;flex:none;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4f6ef7,#7a5cf0);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.logo .t1{font-weight:700;font-size:15px}
.logo .t2{font-size:11px;color:var(--ink3)}
.nav{padding:6px 10px;flex:1}
.nav .sec{font-size:11px;color:var(--ink3);padding:12px 8px 6px;letter-spacing:1px}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;color:var(--ink2);
  text-decoration:none;font-size:13.5px;margin-bottom:2px;cursor:pointer}
.nav a:hover{background:#f2f4fa}
.nav a.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav a .ico{width:18px;text-align:center;flex:none}


/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:14px;padding:0 26px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:16px;font-weight:700}
.topbar .src{font-size:12px;color:var(--ink3);margin-left:auto;display:flex;align-items:center;gap:6px}
.topbar .src b{color:var(--ink2);font-weight:600}
.content{padding:22px 26px 40px;max-width:1180px;width:100%;margin:0 auto}

/* ---------- period nav ---------- */
.period-nav{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.period-nav .pbtn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;
  cursor:pointer;color:var(--ink2);font-size:14px;line-height:1}
.period-nav .pbtn:hover{border-color:var(--accent);color:var(--accent)}
.period-nav select,.period-nav input[type=date]{
  border:1px solid var(--line);background:#fff;border-radius:8px;height:30px;padding:0 8px;
  font-size:13px;color:var(--ink);font-family:inherit}
.period-nav .cur{font-size:13px;color:var(--ink2);margin-left:4px}
.period-nav .spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;height:30px;padding:0 13px;
  font-size:13px;color:var(--ink2);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#3d5ce5}
.btn.danger{color:var(--up)}
.btn.danger:hover{border-color:var(--up)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 20px;margin-bottom:16px}
.card h3{font-size:13.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .sub{font-weight:400;font-size:12px;color:var(--ink3)}
.card h3 .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media(max-width:920px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.kpi-grid{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:18px 20px;position:relative;transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(23,32,64,.08)}
.kpi .kpi-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.kpi .kpi-emoji{font-size:22px;line-height:1}
.kpi .kpi-trend{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.kpi .kpi-trend.up{color:var(--up)}
.kpi .kpi-trend.down{color:var(--down)}
.kpi .kpi-trend.flat{color:var(--ink3)}
.kpi .val{font-size:28px;font-weight:700;margin:6px 0 4px;letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .kpi-name{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px}
.kpi .kpi-desc{font-size:11.5px;color:var(--ink3);line-height:1.5}
.dkpi .kpi-desc{font-size:11px;color:var(--ink3);line-height:1.5;font-weight:400;margin-top:2px}
.kpi .cmp{font-size:11px;color:var(--ink3);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

.chart-box{width:100%;position:relative}
.chart-box svg{display:block;width:100%}
.tooltip{position:fixed;pointer-events:none;background:#2a3140;color:#fff;border-radius:8px;padding:8px 11px;
  font-size:12px;line-height:1.7;z-index:99;display:none;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap}
.tooltip .tt-t{color:#aab4c6;margin-bottom:2px}

table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt th{font-size:12px;color:var(--ink3);font-weight:600;text-align:right;padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
table.rt th:first-child{text-align:left}
table.rt td{padding:9px 10px;text-align:right;border-bottom:1px solid #f0f2f7;
  font-variant-numeric:tabular-nums;white-space:nowrap}
table.rt td:first-child{text-align:left;color:var(--ink2)}
table.rt tr:last-child td{border-bottom:none}
table.rt tr.cur td{background:var(--accent-weak)}
table.rt .d-up{color:var(--up)} table.rt .d-down{color:var(--down)} table.rt .d-flat{color:var(--ink3)}
table.rt tbody tr:hover td{background:#f8f9fc}
table.rt tbody tr:nth-child(even) td{background:#fafbfd}
table.rt tbody tr:nth-child(even):hover td{background:#f3f5fa}
table.rt .eval-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
table.rt .eval-badge.good{background:#e9f7f0;color:#1e9e62}
table.rt .eval-badge.warn{background:#fdf1e3;color:#c77c1a}
table.rt .eval-badge.bad{background:#fde8eb;color:#d5384a}
table.rt .eval-badge.flat{background:#f0f2f7;color:var(--ink3)}

.summary{font-size:13.5px;line-height:2;color:var(--ink)}
.summary b{color:var(--accent)}
.summary .neg{color:var(--up)} .summary .pos{color:var(--down)}

/* ---------- empty / data mgmt ---------- */
.empty{padding:70px 20px;text-align:center;color:var(--ink3)}
.empty .big{font-size:38px;margin-bottom:12px}
.empty p{margin-bottom:16px}
.dm-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dm-grid .card{margin-bottom:0}
.file-drop{border:1.5px dashed #c9d1e3;border-radius:10px;padding:26px 16px;text-align:center;color:var(--ink2);
  cursor:pointer;transition:.15s}
.file-drop:hover{border-color:var(--accent);background:var(--accent-weak)}
.file-drop .big{font-size:26px;margin-bottom:8px}
.file-drop em{font-style:normal;font-size:12px;color:var(--ink3);display:block;margin-top:6px}
textarea.paste{width:100%;height:130px;border:1px solid var(--line);border-radius:8px;padding:10px;
  font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical;color:var(--ink)}
.hint{font-size:12px;color:var(--ink3);line-height:1.8;margin-top:8px}
.stat-row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:4px}
.stat-row .s .k{font-size:11px;color:var(--ink3);margin-bottom:3px}
.stat-row .s .v{font-size:15px;font-weight:700}
table.plain{width:100%;border-collapse:collapse;font-size:13px}
table.plain th{font-size:12px;color:var(--ink3);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:600}
table.plain td{padding:7px 8px;border-bottom:1px solid #f0f2f7}
table.plain input[type=text],table.plain select{border:1px solid var(--line);border-radius:6px;height:28px;
  padding:0 7px;font-size:12.5px;font-family:inherit;color:var(--ink);background:#fff}
table.plain input[type=checkbox]{accent-color:var(--accent)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge.daily{background:#eef1fe;color:#4f6ef7}
.badge.weekly{background:#e9f7f0;color:#1e9e62}
.badge.monthly{background:#fdf1e3;color:#c77c1a}
.badge.yearly{background:#f0e9f7;color:#7c5cd6}
.snap-item{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid #f0f2f7}
.snap-item:last-child{border-bottom:none}
.snap-item .info{flex:1}
.snap-item .info .t{font-weight:600;font-size:13.5px}
.snap-item .info .m{font-size:11.5px;color:var(--ink3);margin-top:3px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#2a3140;color:#fff;
  padding:10px 20px;border-radius:10px;font-size:13px;z-index:200;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}

@media (max-width:920px){.sidebar{display:none}.dm-grid{grid-template-columns:1fr}}
/* ---------- 顶部导航（飞书风格） ---------- */
.ttop{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:12px;padding:0 24px;position:sticky;top:0;z-index:30}
.tt-logo{width:36px;height:36px;border-radius:9px;background:#3370ff;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:16px;flex:none}
.tt-titles .t1{font-weight:700;font-size:15.5px;line-height:1.25}
.tt-titles .t2{font-size:11px;color:var(--ink3)}
.tt-actions{margin-left:auto;display:flex;gap:9px;align-items:center}
.tt-actions .btn{height:32px;border-radius:8px}

/* ---------- 筛选器 ---------- */
.filterbar{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:14px 18px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.frow .flabel{font-size:12.5px;color:var(--ink3);width:56px;flex:none}
.seg{display:flex;gap:0;background:#f2f3f7;border-radius:8px;padding:3px;flex-wrap:wrap}
.seg a{padding:5px 14px;border-radius:6px;font-size:12.5px;color:var(--ink2);cursor:pointer;white-space:nowrap;text-decoration:none}
.seg a:hover{color:var(--ink)}
.seg a.on{background:#fff;color:#3370ff;font-weight:600;box-shadow:0 1px 4px rgba(23,32,64,.12)}

/* ---------- 仪表盘 KPI 行 ---------- */
.dkpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1100px){.dkpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.dkpis{grid-template-columns:repeat(2,1fr)}}
.dkpi{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:15px 17px}
.dkpi .k{font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.dkpi .v{font-size:22px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dkpi .v.c-red{color:#f54a45}.dkpi .v.c-blue{color:#3370ff}.dkpi .v.c-green{color:#1e9e62}.dkpi .v.c-orange{color:#ff8800}

/* ---------- 图表区 ---------- */
.duo-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:980px){.duo-grid{grid-template-columns:1fr}}
.duo-grid .card{margin-bottom:0}
.bar-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.bar-title::before{content:'';width:3.5px;height:15px;border-radius:2px;background:#3370ff;display:inline-block}
.bar-title .sub{font-weight:400;font-size:12px;color:var(--ink3)}
.chart-legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);align-items:center}
.chart-legend .li{display:inline-flex;align-items:center;gap:5px}
.chart-legend .dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.chart-legend .dot.line{border-radius:50%}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-box{position:relative;flex:none}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center .dc1{font-size:11px;color:var(--ink3)}
.donut-center .dc2{font-size:14.5px;font-weight:700;margin-top:3px}
.dlegend{flex:1;min-width:150px}
.dlegend .li{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:12.5px}
.dlegend .dot{width:9px;height:9px;border-radius:50%;flex:none}
.dlegend .pct{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.dlegend .amt{color:var(--ink3);font-size:11px;margin-left:8px;font-variant-numeric:tabular-nums}

/* ---------- 汇总表 ---------- */
.sumtable td .pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.roi-up{color:#1e9e62;font-weight:600}.roi-down{color:#f54a45;font-weight:600}
.dash-foot{font-size:11px;color:var(--ink3);text-align:center;margin:6px 0 20px;line-height:1.8}

/* ---------- Hero 速览 ---------- */
.hero-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.hero-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.hero-strip{grid-template-columns:1fr}}
.hero{background:linear-gradient(135deg,#fff 0%,#f6f8fd 100%);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 2px 10px rgba(28,52,90,.05);padding:16px 18px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#d8deea}
.hero-primary{background:linear-gradient(135deg,#1e3a8a 0%,#3370ff 100%);border-color:transparent;color:#fff}
.hero-primary::before{background:#fff}
.hero-primary .h-k,.hero-primary .h-sub{color:rgba(255,255,255,.78)}
.hero .h-emoji{font-size:30px;flex:none;line-height:1}
.hero .h-body{flex:1;min-width:0}
.hero .h-k{font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.hero .h-v{font-size:26px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
.hero-primary .h-v{color:#fff;font-size:30px}
.hero .h-sub{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.4}

/* ---------- KPI 行内布局（标签 + delta 同行） ---------- */
.kpi-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px}
.dkpi .k{margin-bottom:0;font-size:12.5px;color:var(--ink2)}
.dkpis-prod{margin-top:-4px}

/* ---------- Delta 标签 ---------- */
.chip{display:inline-flex;align-items:center;gap:2px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip-up{background:#e6f6ed;color:#1e9e62;border:1px solid #c8ecd6}
.chip-down{background:#fdecee;color:#d5384a;border:1px solid #f7c9cf}
.chip-null{background:#f2f3f7;color:var(--ink3);border:1px solid var(--line)}

/* ---------- Section 标题 ---------- */
.section-h{font-size:12.5px;font-weight:600;color:var(--ink2);margin:18px 0 8px;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.section-h::before{content:'';width:4px;height:14px;border-radius:2px;background:#3370ff;display:inline-block}
.section-sub{font-size:11.5px;font-weight:400;color:var(--ink3);margin-left:6px}

/* ---------- 告警卡片 ---------- */
.alerts-card{border-left:3px solid #ff8800}
.alerts-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.alert{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:8px;font-size:12.5px;line-height:1.5}
.alert .ai{font-size:18px;flex:none}
.alert-red{background:#fdecee;color:#a02938;border:1px solid #f7c9cf}
.alert-yellow{background:#fff7e6;color:#8a5800;border:1px solid #ffe0a8}
.alert-green{background:#e6f6ed;color:#1a6f47;border:1px solid #c8ecd6}

@media print{
  .ttop,.period-nav,.no-print{display:none!important}
  body{background:#fff}
  .content{padding:0;max-width:none}
  .card{box-shadow:none;border-color:#ddd;break-inside:avoid}
}
/* ---------- 数据解锁层 ---------- */
.lock-layer{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 800px at 50% 20%,#f4f6fb 0%,#e8ecf4 60%,#dde3ee 100%)}
.lock-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px 34px 30px;width:min(400px,92vw);
  box-shadow:0 24px 60px rgba(30,42,66,.14);text-align:center}
.lock-emoji{font-size:40px;margin-bottom:10px}
.lock-t1{font-size:19px;font-weight:700;color:var(--ink)}
.lock-t2{font-size:12.5px;color:var(--ink3);margin:6px 0 20px;line-height:1.6}
.lock-card input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;height:42px;
  padding:0 14px;font-size:14px;font-family:inherit;text-align:center;letter-spacing:.5px;outline:none;transition:border-color .2s}
.lock-card input:focus{border-color:var(--accent)}
.lock-card .btn{width:100%;margin-top:12px;height:42px;border-radius:10px;font-size:14px}
.lock-err{color:#d5384a;font-size:12.5px;margin-top:10px;min-height:18px}
.lock-foot{font-size:11px;color:var(--ink3);margin-top:16px;line-height:1.6}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.lock-card.shake{animation:shake .45s}

/* ---------- 5 模块顶部导航（仪表盘风格顶部 tab） ---------- */
.modnav{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:6px;margin-bottom:16px;display:flex;gap:4px;overflow-x:auto}
.modnav a{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;font-size:13px;
  color:var(--ink2);text-decoration:none;white-space:nowrap;cursor:pointer;transition:.12s}
.modnav a:hover{background:#f2f4fa;color:var(--ink)}
.modnav a.on{background:linear-gradient(135deg,#3370ff 0%,#1e3a8a 100%);color:#fff;font-weight:600;
  box-shadow:0 4px 12px rgba(51,112,255,.3)}
.modnav a .ico{font-size:15px}

/* ---------- 12 分组 KPI 网格 ---------- */
.kpi-groups{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:980px){.kpi-groups{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.kpi-groups{grid-template-columns:1fr}}

/* ---------- 估算标签 ---------- */
.est-tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600;
  background:#fff7e6;color:#8a5800;border:1px solid #ffe0a8;margin-left:6px;letter-spacing:.3px}
.est-tag::before{content:'📐';margin-right:3px;font-size:10px}

/* ---------- 健康度雷达 ---------- */
.radar-wrap{display:flex;align-items:center;justify-content:center;padding:8px 0}
.radar-svg{max-width:340px;width:100%;height:auto}
.radar-dim{font-size:11.5px;color:var(--ink2);font-weight:500}

<script>
'use strict';
/* =========================================================
   简报中心 · 日/周/月业务报告系统（纯前端，数据存 localStorage）
   ========================================================= */

/* ---------- 全局状态 ---------- */
const LS_DATA='reportHub.data.v1', LS_CFG='reportHub.cfg.v1', LS_SNAP='reportHub.snap.v1';
let state={rows:[],columns:[],config:{},sourceName:'',targets:{}};
/* 显示名映射（财务报表风）：只改界面文案，不改数据列名/数据库字段 */
const DISP_NAMES={'总收入':'GMV','总支出':'总消耗','净收入':'净利','总退款':'退款','总推广支出':'推广消耗','总销量':'销量(件)'};
const KPI_EMOJIS={'总收入':'💰','总支出':'📉','净收入':'✨','总退款':'🔄','总推广支出':'🚀','总销量':'📦','__material_cost':'🧱','__real_roi':'🎯'};
function dispName(col){return DISP_NAMES[col]||col;}
const KPI_DESC={'总收入':'成交总额 Gross Merchandise Volume，全渠道成交额汇总','总支出':'营销总花费 = 推广消耗 + 退款金额','净收入':'GMV 扣除推广和退款后的实际利润','总退款':'全渠道退款订单金额合计','总推广支出':'各平台广告投放总花费','总销量':'成交订单总件数','__material_cost':'物料成本 = 综合单瓶物料(不含试香) × 总销量；产品按预估月销量加权','__real_roi':'真实ROI = GMV ÷ (物料成本 + 推广支出)，不含试香 BOM 口径'};
let snapshots=[];
let curView='dashboard';  // dashboard|daily|weekly|monthly|yearly|archive|data|product|finance|channels|supply
let MOD_VIEW='dashboard'; // 模块顶栏（与 curView 区分）：dashboard|channels|product|supply|finance
let finTab='overview';    // overview|income|platform|balance|assets
let dashTime='month';     // 仪表盘时间筛选：today|week|month|year|all
let dashPlatform='全部';   // 仪表盘平台筛选
const DONUT_COLORS=['#3370ff','#ff9f2b','#e0577b','#2ec5ad','#8f6bf2','#f5b93d'];
let curPeriod=null;       // 当前报告期 key
let chartMetric=null;     // 当前图表选中指标
const COLORS=['#4f6ef7','#22a06b','#e8790a','#d5497f','#7c5cd6','#0e9bb5','#c95d2b'];

/* ---------- 工具 ---------- */
const isLocal=()=>location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.hostname==='[::1]';
const $=s=>document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

function parseDateStr(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v)){
    const d2=new Date(v.getTime());
    const h=d2.getHours(),mi=d2.getMinutes(),se=d2.getSeconds();
    if(h===23&&mi===59&&se>=50)d2.setTime(d2.getTime()+60000);   // 贴近午夜的负向漂移 → 进位到次日
    return d2s(d2);
  }
  if(typeof v==='number'){ if(v>20000&&v<60000){const d=new Date(Math.round((v-25569)*86400000));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;} return null; }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})[日]?(?:[ T].*)?$/);
  if(m){const y=+m[1],mo=+m[2],d=+m[3];
    if(mo>=1&&mo<=12&&d>=1&&d<=31)return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m){const mo=+m[1],d=+m[2],y=+m[3];
    if(mo>=1&&mo<=12&&d>=1&&d<=31)return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
  return null;
}
function d2s(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseNum(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  let s=String(v).trim().replace(/[,\s￥¥$%]/g,'');
  if(s==='')return null;
  const n=parseFloat(s);
  return isFinite(n)?n:null;
}
function getISOWeek(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const dayNum=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dayNum+3);
  const firstThursday=new Date(d.getFullYear(),0,4);
  const week=1+Math.round(((d-firstThursday)/86400000-3+((firstThursday.getDay()+6)%7))/7);
  return {year:d.getFullYear(),week};
}
function weekKeyOf(dateStr){const w=getISOWeek(dateStr);return `${w.year}-W${String(w.week).padStart(2,'0')}`;}
function weekRangeLabel(key){
  const [y,w]=key.split('-W').map(Number);
  const jan4=new Date(y,0,4);
  const dayNum=(jan4.getDay()+6)%7;
  const monday=new Date(jan4);monday.setDate(jan4.getDate()-dayNum+(w-1)*7);
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
  const f=d=>`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return `${f(monday)} ~ ${f(sunday)}`;
}
function monthKeyOf(dateStr){return dateStr.slice(0,7);}
function monthLabel(key){const[y,m]=key.split('-');return `${y} 年 ${+m} 月`;}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d2s(d);}

/* ---------- 格式化 ---------- */
function compactNum(v){
  const a=Math.abs(v);
  if(a>=1e8)return (v/1e8).toFixed(2)+'亿';
  if(a>=1e4)return (v/1e4).toFixed(2)+'万';
  return v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtVal(v,fmt){
  if(v==null||isNaN(v))return '—';
  switch(fmt){
    case 'cny':return '¥'+compactNum(v);
    case 'pct':return v.toFixed(2)+'%';
    case 'float2':return v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    default:return v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
}
function fmtValAxis(v,fmt){
  if(v==null||isNaN(v))return '—';
  if(fmt==='pct')return v.toFixed(1)+'%';
  const a=Math.abs(v);
  if(a>=1e8)return (v/1e8).toFixed(1).replace(/\.0$/,'')+'亿';
  if(a>=1e4)return (v/1e4).toFixed(1).replace(/\.0$/,'')+'万';
  return Math.round(v).toLocaleString('zh-CN');
}

/* ---------- 聚合 ---------- */
function aggRows(rows,metric){
  const cfg=state.config[metric]||{agg:'sum'};
  const vals=rows.map(r=>r.values[metric]).filter(v=>v!=null&&!isNaN(v));
  if(!vals.length)return null;
  if(cfg.agg==='avg')return vals.reduce((a,b)=>a+b,0)/vals.length;
  if(cfg.agg==='last'){
    const sorted=[...rows].sort((a,b)=>a.date<b.date?-1:1);
    for(let i=sorted.length-1;i>=0;i--){const v=sorted[i].values[metric];if(v!=null&&!isNaN(v))return v;}
  }
  return vals.reduce((a,b)=>a+b,0);
}

/* ---------- 真实 ROI（物料 + 推广 / GMV） ---------- */
// 综合单瓶物料（按预估月销量加权）：用于估算某时段的总物料成本
function blendedUnitMaterial(){
  const items=prodItems();
  if(!items.length) return null;
  let totalQty=0, totalCost=0;
  for(const it of items){
    const q=+it.est_monthly_qty||0;
    totalQty+=q; totalCost+=(+it.unit_cost||0)*q;
  }
  return totalQty>0 ? +(totalCost/totalQty).toFixed(4) : null;
}
// 时段真实 KPI：物料(综合×瓶) + 推广 → 真实ROI = GMV ÷ 真实总成本
function periodRealStats(rows){
  const u=blendedUnitMaterial();
  const qty=rows.reduce((a,r)=>a+(+r.values['总销量']||0),0);
  const gmv=rows.reduce((a,r)=>a+(+r.values['总收入']||0),0);
  const promo=rows.reduce((a,r)=>a+(+r.values['总推广支出']||0),0);
  const materialCost=+(u!=null ? u*qty : 0).toFixed(2);
  const realCost=+(materialCost+promo).toFixed(2);
  const realRoi=realCost>0?+(gmv/realCost).toFixed(2):null;
  return {qty,gmv,promo,materialCost,realCost,realRoi,unitMaterial:u};
}
function groupBy(rows,keyFn){
  const map=new Map();
  for(const r of rows){const k=keyFn(r);if(!map.has(k))map.set(k,[]);map.get(k).push(r);}
  return map;
}

/* ---------- 指标配置推测 ---------- */
function guessCfg(col){
  const name=col.toLowerCase();
  const cfg={name:col,agg:'sum',fmt:'int',invert:false,core:true};
  if(/率|占比|percent|ratio/.test(name)){cfg.agg='avg';cfg.fmt='pct';cfg.invert=true;}
  else if(/退款|推广|支出|成本/.test(name)){cfg.fmt='cny';cfg.invert=true;}
  else if(/额|价|收入|金额|营收|gmv|cost|price|amount/.test(name)){cfg.fmt='cny';}
  else if(/客单|arpu|均值/.test(name)){cfg.agg='avg';cfg.fmt='float2';}
  return cfg;
}
function coreColumns(){
  const c=state.columns.filter(col=>{const cfg=state.config[col];return !cfg||cfg.core!==false;});
  return c.length?c:state.columns.slice();
}

/* ---------- 数据导入 ---------- */
function parseCSV(text){
  const rows=[];let cur=[],val='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){val+='"';i++;} else q=false; } else val+=c; }
    else if(c==='"')q=true;
    else if(c===','){cur.push(val);val='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; cur.push(val);val=''; if(cur.some(x=>x!==''))rows.push(cur); cur=[]; }
    else val+=c;
  }
  cur.push(val); if(cur.some(x=>x!==''))rows.push(cur);
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function importTable(table,sourceName,mode){
  if(table.length<2){toast('数据至少需要表头 + 1 行');return false;}
  const header=table[0].map(h=>String(h).trim());
  // 找日期列
  let dateCol=-1,best=0;
  for(let c=0;c<header.length;c++){
    let hits=0,n=0;
    for(let r=1;r<table.length&&r<=25;r++){n++;if(parseDateStr(table[r][c]))hits++;}
    if(n&&hits/n>=0.6&&hits>best){best=hits;dateCol=c;}
  }
  if(dateCol<0){toast('未识别到日期列（支持 2026-08-22 / 2026/8/22 / 8/22/2026 等格式）');return false;}
  // 数值列
  const cols=[];
  for(let c=0;c<header.length;c++){
    if(c===dateCol)continue;
    let hits=0,n=0;
    for(let r=1;r<table.length&&r<=40;r++){const v=parseNum(table[r][c]);if(v!=null)hits++;else if(String(table[r][c]||'').trim()!=='')n++;}
    if(hits>0&&hits>=Math.max(1,hits+n-3))cols.push(c);
  }
  if(!cols.length){toast('未识别到数值指标列');return false;}
  const rows=[];
  for(let r=1;r<table.length;r++){
    const date=parseDateStr(table[r][dateCol]); if(!date)continue;
    const values={};let ok=false;
    for(const c of cols){const v=parseNum(table[r][c]);if(v!=null){values[header[c]]=v;ok=true;}}
    if(ok)rows.push({date,values});
  }
  if(!rows.length){toast('没有可用的数据行');return false;}
  rows.sort((a,b)=>a.date<b.date?-1:1);
  // 追加模式：按日期合并进历史库（同日覆盖、异日新增），周报月报自动随累积数据更新
  if(mode==='append'&&state.rows.length){
    const byDate=new Map(state.rows.map(r=>[r.date,r]));
    for(const r of rows){
      if(byDate.has(r.date))Object.assign(byDate.get(r.date).values,r.values);
      else byDate.set(r.date,{date:r.date,values:{...r.values}});
    }
    state.rows=[...byDate.values()].sort((a,b)=>a.date<b.date?-1:1);
    const newCols=cols.map(c=>header[c]);
    for(const c of newCols)if(!state.columns.includes(c))state.columns.push(c);
    for(const c of newCols)if(!state.config[c])state.config[c]=guessCfg(c);
    if(!chartMetric||!state.columns.includes(chartMetric))chartMetric=state.columns[0];
    state.sourceName=`累积数据（最近导入：${sourceName}）`;
    state.lastImportAt=new Date().toLocaleString('zh-CN');
    state.dataUpdatedAt=Date.now();
    curPeriod=null;
    saveState();
    toast(`已更新：本次 ${rows.length} 行（${rows[0].date} ~ ${rows[rows.length-1].date}），累计 ${state.rows.length} 天`);
    render();
    return true;
  }
  state.rows=rows;
  state.columns=cols.map(c=>header[c]);
  state.config={};
  for(const col of state.columns)state.config[col]=guessCfg(col);
  state.sourceName=sourceName;
  state.lastImportAt=new Date().toLocaleString('zh-CN');
  state.dataUpdatedAt=Date.now();
  curPeriod=null;chartMetric=state.columns[0];
  saveState();
  toast(`导入成功：${rows.length} 行 · ${state.columns.length} 个指标`);
  render();
  return true;
}
function getImportMode(){const s=document.getElementById('importMode');return s&&s.value?s.value:'append';}

/* ---------- 营销发展日报专用解析（识别「N月汇总」双层表头） ---------- */
function normMetric(m){
  if(m.indexOf('当日')===0)m=m.slice(2);
  if(m.indexOf('日')===0)m=m.slice(1);
  if(m==='推广/支出'||m==='推广')m='推广支出';
  if(m.indexOf('净收')===0)m='净收入';
  return m;
}
function mktColName(ch,m){
  m=normMetric(m);
  if(ch==='总览')return m==='收入'?'总收入':m==='支出'?'总支出':m;
  return ch+m;
}
function parseMarketingWorkbook(wb,today){
  const sheetNames=((wb&&wb.SheetNames)||[]).filter(n=>/^\d{1,2}月汇总$/.test(n));
  if(!sheetNames.length)return null;
  const byDate=new Map();const allCols=new Set();
  for(const name of sheetNames){
    const ws=wb.Sheets[name];if(!ws)continue;
    if(ws['!ref']){  // 限制列数，避免个别表拖到 XFD 的超大空范围
      const rg=XLSX.utils.decode_range(ws['!ref']);
      if(rg.e.c>60)rg.e.c=60;
      ws['!ref']=XLSX.utils.encode_range(rg);
    }
    const table=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    if(table.length<3)continue;
    const r1=table[0]||[],r2=table[1]||[];
    // 渠道分块：第一行有显式渠道名，或指标循环回到「收入」都视为新渠道
    const blocks=[];let cur=null;
    for(let c=1;c<r2.length;c++){
      const raw=r2[c];
      if(raw==null||String(raw).trim()==='')continue;
      const m=normMetric(String(raw).trim());
      const label=(r1[c]!=null&&String(r1[c]).trim()!=='')?String(r1[c]).trim():null;
      if(label||(m==='收入'&&cur)){
        let nm=label;
        if(!nm){for(let k=c;k<Math.min(c+5,r1.length);k++){
          if(r1[k]!=null&&String(r1[k]).trim()!==''){nm=String(r1[k]).trim();break;}}}
        cur={name:nm||('渠道'+(blocks.length+1)),cols:[]};
        blocks.push(cur);
      }
      if(cur)cur.cols.push({c,m});
    }
    for(let r=2;r<table.length;r++){
      const row=table[r]||[];
      const date=parseDateStr(row[0]);
      if(!date||date>today)continue;          // 跳过汇总行与预填的未来日期
      const values={};let nonZero=false;
      for(const blk of blocks){
        for(const cc of blk.cols){
          const v=parseNum(row[cc.c]);
          if(v==null)continue;
          values[mktColName(blk.name,cc.m)]=Math.round(v*100)/100;
          if(v!==0)nonZero=true;
        }
      }
      if(!nonZero)continue;                    // 跳过整行全 0 的预填行
      if(!byDate.has(date))byDate.set(date,{date,values:{}});
      Object.assign(byDate.get(date).values,values);
      for(const k in values)allCols.add(k);
    }
  }
  if(!byDate.size)return null;
  for(const row of byDate.values()){           // 派生指标：总退款 / 总销量 / 总推广支出
    let rf=0,sl=0,pr=0;
    for(const k in row.values){
      if(k.endsWith('退款'))rf+=row.values[k];
      else if(k.endsWith('销量'))sl+=row.values[k];
      else if(k.endsWith('推广支出'))pr+=row.values[k];
    }
    row.values['总退款']=Math.round(rf*100)/100;
    row.values['总销量']=sl;
    row.values['总推广支出']=Math.round(pr*100)/100;
  }
  allCols.add('总退款');allCols.add('总销量');allCols.add('总推广支出');
  const core=['总收入','总支出','总推广支出','净收入','总退款','总销量'];
  const chans=['淘宝','抖音','拼多多','小红书','tiktok'];
  const mets=['收入','退款','推广支出','净收入','销量'];
  const columns=core.filter(c=>allCols.has(c))
    .concat(chans.reduce((acc,ch)=>acc.concat(mets.map(m=>ch+m)),[]).filter(c=>allCols.has(c)));
  for(const c of Array.from(allCols).sort())if(!columns.includes(c))columns.push(c);
  return {rows:Array.from(byDate.values()).sort((a,b)=>a.date<b.date?-1:1),columns};
}
function importMarketingWorkbook(wb){
  const r=parseMarketingWorkbook(wb,d2s(new Date()));
  if(!r)return false;
  state.rows=r.rows;state.columns=r.columns;
  state.config={};
  const core=['总收入','总支出','总推广支出','净收入','总退款','总销量'];
  for(const col of r.columns){
    const cfg=guessCfg(col);cfg.core=core.includes(col);
    state.config[col]=cfg;
  }
  state.sourceName='营销发展日报.xlsx';
  state.lastImportAt=new Date().toLocaleString('zh-CN');
  state.dataUpdatedAt=Date.now();
  curPeriod=null;chartMetric=state.columns.includes('总收入')?'总收入':state.columns[0];
  saveState();
  toast(`营销日报导入成功：${r.rows.length} 天 · ${r.columns.length} 项指标`);
  render();
  return true;
}
function readFile(f){
  const isXlsx=/\.(xlsx|xls)$/i.test(f.name);
  if(isXlsx){
    if(window.__noXLSX||typeof XLSX==='undefined'){toast('Excel 解析组件未加载（需要联网），请改用 CSV');return;}
    const fr=new FileReader();
    fr.onload=e=>{
      try{
        // 注意：不能用 cellDates —— SheetJS 0.18.5 在东八区会把日期转成差 43 秒不到午夜的 Date，
        // 导致日期整体偏移一天；这里直接解析序列号（parseDateStr 的 UTC 分支），任何时区都稳定
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        if(importMarketingWorkbook(wb))return;
        const ws=wb.Sheets[wb.SheetNames[0]];
        const table=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
        importTable(table,f.name,getImportMode());
      }catch(err){toast('解析失败：'+err.message);}
    };
    fr.readAsArrayBuffer(f);
  }else{
    const fr=new FileReader();
    fr.onload=e=>{try{importTable(parseCSV(e.target.result),f.name,getImportMode());}catch(err){toast('解析失败：'+err.message);}};
    fr.readAsText(f,'utf-8');
  }
}

/* ---------- 数据加密 / 解密（AES-256-GCM，与 generate-deploy-data.js 参数一致） ---------- */
const SS_PW='mrs_unlock_pw';
const LS_GHTOKEN='mrs_gh_token';
const GH_REPO='ttttttt930/marketing-report',GH_BRANCH='main',GH_DATA_PATH='marketing-data.js';
const enc2hex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const hex2buf=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function deriveKey(password,saltBytes,iter){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:saltBytes,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function decryptSnapshot(enc,password){
  const key=await deriveKey(password,hex2buf(enc.salt),enc.iter||150000);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:hex2buf(enc.iv)},key,hex2buf(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function encryptSnapshot(obj,password){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(password,salt,150000);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return {v:1,iter:150000,salt:enc2hex(salt),iv:enc2hex(iv),ct:enc2hex(ct),
    updatedAt:Date.now(),meta:(obj.rows?obj.rows.length+'天 '+(obj.columns||[]).length+'项指标':'')};
}

/* ---------- 报告构建 ---------- */
function periodsOf(type){
  if(!state.rows.length)return[];
  if(type==='daily')return [...new Set(state.rows.map(r=>r.date))].sort();
  if(type==='weekly')return [...new Set(state.rows.map(r=>weekKeyOf(r.date)))].sort();
  if(type==='yearly')return [...new Set(state.rows.map(r=>r.date.slice(0,4)))].sort();
  return [...new Set(state.rows.map(r=>monthKeyOf(r.date)))].sort();
}
function keyOfDate(type,dateStr){
  if(type==='daily')return dateStr;
  if(type==='weekly')return weekKeyOf(dateStr);
  if(type==='yearly')return dateStr.slice(0,4);
  return monthKeyOf(dateStr);
}
function periodTitle(type,key){
  if(type==='daily'){const d=new Date(key+'T00:00:00');
    const wd=['日','一','二','三','四','五','六'][d.getDay()];

  if(type==='weekly')return `${key.split('-W')[0]} 年第 ${+key.split('-W')[1]} 周（${weekRangeLabel(key)}）`;
  if(type==='yearly')return `${key} 年`;
  return monthLabel(key);
}
function prevKey(list,key){const i=list.indexOf(key);return i>0?list[i-1]:null;}
function nextKey(list,key){const i=list.indexOf(key);return i>=0&&i<list.length-1?list[i+1]:null;}

/* ---------- 目标达成 & 月度预测 ---------- */
function monthProgress(monthKey,metric){
  const rows=state.rows.filter(r=>r.date.slice(0,7)===monthKey);
  if(!rows.length)return null;
  const cumulative=aggRows(rows,metric);
  const tgt=(state.targets[monthKey]||{})[metric];
  const [y,m]=monthKey.split('-').map(Number);
  const dim=new Date(y,m,0).getDate();
  const latestDay=+rows[rows.length-1].date.slice(8,10);
  const isCur=monthKey===d2s(new Date()).slice(0,7);
  let forecast=cumulative,status='—';
  if(isCur&&latestDay>0&&latestDay<dim){
    forecast=(cumulative/latestDay)*dim;                 // 已过天数日均值外推到月底
  }
  const pace=tgt?cumulative/tgt:0;
  if(tgt){
    if(isCur&&latestDay<dim){
      status=forecast>=tgt?'领先':forecast>=tgt*0.9?'持平':'落后';
    }else{
      status=cumulative>=tgt?'达成':'未达成';
    }
  }
  return {cumulative,target:tgt,forecast,pace,status,latestDay,dim,isCur};
}
function targetCardHtml(monthKey){
  const defaults=['净收入','总收入'].filter(c=>state.columns.includes(c));
  const extra=Object.keys(state.targets[monthKey]||{}).filter(c=>!defaults.includes(c)&&state.columns.includes(c));
  const metrics=defaults.concat(extra);
  if(!metrics.length)return '';
  let rowsHtml='';
  for(const metric of metrics){
    const p=monthProgress(monthKey,metric);
    if(!p)continue;
    const cfg=state.config[metric]||{name:metric,fmt:'cny'};
    const pct=p.target?Math.min(100,p.pace*100):0;
    const good=p.status==='领先'||p.status==='达成';
    const barColor=!p.target?'#c9d1e3':(good?'#1e9e62':p.status==='持平'?'#c77c1a':'#d5384a');
    const gap=p.target?p.forecast-p.target:0;
    rowsHtml+=`<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #f0f2f7">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <b style="font-size:13px">${esc(dispName(metric))}</b>
        <span style="font-size:12px;color:var(--ink3)">目标 ¥ <input type="number" data-tgt-metric="${esc(metric)}" value="${p.target||''}" style="width:96px;border:1px solid var(--line);border-radius:6px;height:26px;padding:0 7px;font-size:12.5px;font-family:inherit" placeholder="未设"></span>
      </div>
      <div style="height:12px;background:#eef1f6;border-radius:7px;overflow:hidden">
        <div style="width:${pct.toFixed(1)}%;height:100%;background:${barColor};transition:width .5s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:12.5px;color:var(--ink2)">
        <span>累计 <b style="color:var(--ink)">${fmtVal(p.cumulative,'cny')}</b>${p.target?` <span style="color:var(--ink3)">/ ${fmtVal(p.target,'cny')} · ${pct.toFixed(2)}%</span>`:''}</span>
        ${p.target?`<span>预测月底 <b style="color:${barColor}">${fmtVal(p.forecast,'cny')}</b> · <span style="color:${barColor};font-weight:600">${p.status}</span>${gap!==0?`（${gap>0?'超':'差'} ${fmtVal(Math.abs(gap),'cny')}）`:''}</span>`:''}
      </div>
    </div>`;
  }
  const p0=monthProgress(monthKey,metrics[0]);
  return `<div class="card"><h3>🎯 目标达成 &amp; 月度预测 <span class="sub">${monthLabel(monthKey)}${p0&&p0.isCur?` · 已过 ${p0.latestDay}/${p0.dim} 天`:''}</span>
    <div class="right"><button class="btn primary" id="saveTargetBtn">保存目标</button></div></h3>
    ${rowsHtml}
    <div class="hint">预测逻辑：本月"累计值 ÷ 已过天数 × 当月总天数"外推到月底。过去月份显示实际达成。目标只存在本机浏览器，可随时改。</div>
  </div>`;
}

function buildReport(type,key){
  const list=periodsOf(type);
  const groups=groupBy(state.rows,r=>keyOfDate(type,r.date));
  const curRows=groups.get(key)||[];
  const pk=prevKey(list,key);
  const prevRows=pk?(groups.get(pk)||[]):[];
  const prevTitle=pk?periodTitle(type,pk):'上一期';

  const kpiCols=coreColumns();
  const kpis=kpiCols.map((col,i)=>{
    const cfg=state.config[col]||guessCfg(col);
    const cur=aggRows(curRows,col), prev=aggRows(prevRows,col);
    let delta=null;
    if(cur!=null&&prev!=null&&prev!==0)delta=(cur-prev)/Math.abs(prev)*100;
    return {col,name:dispName(col),cur,prev,delta,fmt:cfg.fmt,invert:!!cfg.invert,color:COLORS[i%COLORS.length]};
  });

  // 真实 ROI（物料 + 推广 / GMV）—— 仅当有产品快照时计算，追加到 KPI 卡列表
  if(prodItems().length){
    const curR=periodRealStats(curRows);
    const prevR=pk?periodRealStats(prevRows):{materialCost:null,realRoi:null};
    let matDelta=null, roiDelta=null;
    if(curR.materialCost!=null&&prevR.materialCost!=null&&prevR.materialCost!==0){
      matDelta=(curR.materialCost-prevR.materialCost)/Math.abs(prevR.materialCost)*100;
    }
    if(curR.realRoi!=null&&prevR.realRoi!=null&&prevR.realRoi!==0){
      roiDelta=(curR.realRoi-prevR.realRoi)/Math.abs(prevR.realRoi)*100;
    }
    kpis.push({col:'__material_cost',name:'物料成本',cur:curR.materialCost,prev:prevR.materialCost,delta:matDelta,fmt:'cny',invert:true});
    kpis.push({col:'__real_roi',name:'真实ROI',cur:curR.realRoi,prev:prevR.realRoi,delta:roiDelta,fmt:'float2',invert:false});
  }

  // 年报：按月展开（1-12 月 + 全年汇总行），图表用月维度、明细正序
  if(type==='yearly'){
    const year=key,mg=groupBy(state.rows,r=>monthKeyOf(r.date));
    const chartKeys=[],chartLabels=[];
    for(let m=1;m<=12;m++){chartKeys.push(`${year}-${String(m).padStart(2,'0')}`);chartLabels.push(m+'月');}
    const chartData={};
    for(const col of state.columns)chartData[col]=chartKeys.map(k=>aggRows(mg.get(k)||[],col));
    const tableRows=chartKeys.map(k=>({key:k,label:monthLabel(k),vals:kpiCols.map(col=>aggRows(mg.get(k)||[],col))}));
    tableRows.push({key:year,label:`${year} 年 全年`,vals:kpiCols.map(col=>aggRows(curRows,col))});
    return {type,key,title:periodTitle(type,key),prevTitle,pk,nk:nextKey(list,key),
      kpis,chartLabels,chartKeys,chartData,tableRows,tableAsc:true,
      rowsN:curRows.length,hasData:curRows.length>0,
      summary:buildSummary(type,key,kpis,list,groups,chartKeys)};
  }

  // 图表数据：近 N 期（日30/周12/月12），含每个指标序列
  const N=type==='daily'?30:12;
  const idx=list.indexOf(key);
  const start=Math.max(0,idx-N+1);
  const chartKeys=list.slice(start,idx+1);
  const chartLabels=chartKeys.map(k=>type==='daily'?k.slice(5).replace('-','/'):
    type==='weekly'?'W'+(+k.split('-W')[1]):+(k.split('-')[1])+'月');
  const chartData={};
  for(const col of state.columns){
    chartData[col]=chartKeys.map(k=>aggRows(groups.get(k)||[],col));
  }
  // 明细表：日报近30天，其他近8期
  const lookBack=type==='daily'?29:7;
  const tStart=Math.max(0,idx-lookBack);
  const tableKeys=list.slice(tStart,idx+1).reverse();
  const tableRows=tableKeys.map(k=>{
    const row={key:k,label:periodTitle(type,k),vals:kpiCols.map(col=>aggRows(groups.get(k)||[],col))};
    return row;
  });

  return {type,key,title:periodTitle(type,key),prevTitle,pk,nk:nextKey(list,key),
    kpis,chartLabels,chartKeys,chartData,tableRows,
    rowsN:curRows.length,hasData:curRows.length>0,
    summary:buildSummary(type,key,kpis,list,groups,chartKeys)};
}

function buildSummary(type,key,kpis,list,groups,chartKeys){
  if(!kpis.length)return '';
  const tName={daily:'当日',weekly:'本周',monthly:'本月',yearly:'本年'}[type]||'本期';
  const valid=kpis.filter(k=>k.cur!=null);
  if(!valid.length)return '当期无数据。';
  const ups=valid.filter(k=>k.delta!=null&&k.delta>0.5);
  const downs=valid.filter(k=>k.delta!=null&&k.delta<-0.5);
  const parts=[];
  // 1. 总览（配色修正：上涨红 neg、下跌绿 pos）
  parts.push(`${tName}共统计 <b>${valid.length}</b> 项核心指标：`+
    `<span class="neg">${ups.length} 项上涨</span>、<span class="pos">${downs.length} 项下跌</span>。`);
  // 2. 投产比洞察
  const gcol=n=>kpis.find(k=>k.col===n);
  const ni=gcol('净收入'),te=gcol('总支出'),rv=gcol('总收入');
  if(ni&&te&&ni.cur!=null&&te.cur!=null&&te.cur!==0){
    const roas=ni.cur/te.cur;
    let line=`ROI（净利/总消耗）为 <b>${(roas*100).toFixed(0)}%</b>`;
    if(ni.prev!=null&&te.prev!=null&&te.prev!==0){
      const proas=ni.prev/te.prev,dr=(roas-proas)/Math.abs(proas)*100,good=dr>0;
      line+=`，较上期${good?'提升':'下降'} <b>${Math.abs(dr).toFixed(1)}%</b>（上期 ${(proas*100).toFixed(0)}%），<span class="${good?'neg':'pos'}">${good?'ROI 改善':'ROI 下滑，消耗增加未换来等比例回款'}</span>`;
    }
    if(rv&&rv.cur!=null&&rv.cur!==0){
      line+=`；推广 ROI（GMV/总消耗）<b>${(rv.cur/te.cur*100).toFixed(0)}%</b>`;
    }
    parts.push(line+'。');
  }
  // 3. Top3 变化幅度
  const ranked=valid.filter(k=>k.delta!=null).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  for(const k of ranked.slice(0,3)){
    const dir=k.delta>0?'增长':'下降';
    const good=k.invert?k.delta<0:k.delta>0;
    parts.push(`<b>${esc(k.name)}</b> 报 ${fmtVal(k.cur,k.fmt)}，环比${dir} <b>${Math.abs(k.delta).toFixed(1)}%</b>，<span class="${good?'neg':'pos'}">${good?'表现良好':'需关注'}</span>。`);
  }
  // 4. 异常波动预警（|环比|≥20%）
  const abn=valid.filter(k=>k.delta!=null&&Math.abs(k.delta)>=20);
  if(abn.length){
    parts.push(`⚠️ 异常波动：${abn.map(k=>`<b>${esc(k.name)}</b>(${k.delta>0?'+':''}${k.delta.toFixed(0)}%)`).join('、')}，变化幅度超 20%，建议排查原因。`);
  }
  // 5. 近期新高/新低
  for(const k of valid){
    const series=chartKeys.map(kk=>aggRows(groups.get(kk)||[],k.col)).filter(v=>v!=null);
    if(series.length>=5&&k.cur!=null&&k.cur===Math.max(...series))
      parts.push(`<b>${esc(k.name)}</b> 创近 ${series.length} 期<b>新高</b>。`);
    else if(series.length>=5&&k.cur===Math.min(...series)&&!k.invert)
      parts.push(`<b>${esc(k.name)}</b> 为近 ${series.length} 期最低值，建议排查原因。`);
    if(parts.length>=7)break;
  }
  return parts.join('');
}

/* ---------- SVG 图表 ---------- */
const tooltip=()=>$('#tooltip');
function renderChart(el,labels,series,fmt){
  el.innerHTML='';
  const W=Math.max(el.clientWidth||760,320),H=250;
  const pl=56,pr=14,pt=14,pb=26,n=labels.length;
  if(!n||series.every(s=>s.values.every(v=>v==null))){el.innerHTML='<div class="empty" style="padding:40px">暂无图表数据</div>';return;}
  let max=-Infinity,min=Infinity;
  series.forEach(s=>s.values.forEach(v=>{if(v!=null){if(v>max)max=v;if(v<min)min=v;}}));
  if(!isFinite(max)){max=1;min=0;}
  if(min>0)min=Math.min(0,min*0.9); if(max<0)max=0;
  if(max===min){max=min+1;}
  const pad=(max-min)*0.08;max+=pad;
  const X=i=>n===1?(pl+pr)/2:pl+(W-pl-pr)*i/(n-1);
  const Y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  // 网格
  for(let g=0;g<=4;g++){
    const v=min+(max-min)*g/4,y=Y(v);
    svg+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#eef1f6" stroke-width="1"/>`;
    svg+=`<text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#9aa3b2">${esc(fmtValAxis(v,fmt))}</text>`;
  }
  // x 标签（最多 8 个）
  const step=Math.ceil(n/8);
  labels.forEach((l,i)=>{if(i%step===0||i===n-1)
    svg+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#9aa3b2">${esc(l)}</text>`;});
  const first=series[0];
  if(first.mode==='bar'){
    const bw=Math.max(4,(W-pl-pr)/n*0.55);
    first.values.forEach((v,i)=>{
      if(v==null)return;
      const x=X(i)-bw/2,y=Y(Math.max(v,min));
      svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,H-pb-y)}" rx="2.5" fill="${first.color}" opacity="0.85"/>`;
    });
  }else{
    series.forEach(s=>{
      let d='',started=false;
      s.values.forEach((v,i)=>{if(v==null){started=false;return;}
        d+=(started?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';started=true;});
      if(!d)return;
      if(s===first){
        const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
        if(pts.length>1){
          let area=`M${pts[0][0]} ${Y(Math.max(min,0))} `;
          pts.forEach(p=>area+=`L${p[0].toFixed(1)} ${p[1].toFixed(1)} `);
          area+=`L${pts[pts.length-1][0]} ${Y(Math.max(min,0))} Z`;
          svg+=`<path d="${area}" fill="${s.color}" opacity="0.08"/>`;
        }
      }
      svg+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dashed?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
      if(s===first)s.values.forEach((v,i)=>{if(v!=null&&n<=32)
        svg+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="#fff" stroke="${s.color}" stroke-width="1.6"/>`;});
    });
  }
  svg+='</svg>';
  // 悬浮层
  const wrap=document.createElement('div');
  wrap.innerHTML=svg;
  const overlay=document.createElement('div');
  overlay.style.cssText='position:absolute;inset:0;display:flex;';
  labels.forEach((l,i)=>{
    const hz=document.createElement('div');
    hz.style.cssText=`flex:1;cursor:crosshair;`;
    hz.addEventListener('mousemove',e=>{
      const tt=tooltip();
      let html=`<div class="tt-t">${esc(l)}</div>`;
      series.forEach(s=>{const v=s.values[i];
        html+=`<div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:5px"></span>${esc(s.name)}：${v==null?'—':fmtVal(v,fmt)}</div>`;});
      tt.innerHTML=html;tt.style.display='block';
      const tw=tt.offsetWidth;
      tt.style.left=Math.min(e.clientX+14,window.innerWidth-tw-10)+'px';
      tt.style.top=(e.clientY+14)+'px';
      const hl=wrap.querySelector('.hover-line');if(hl)hl.remove();
      const svgEl=wrap.querySelector('svg');
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',X(i));line.setAttribute('x2',X(i));
      line.setAttribute('y1',pt);line.setAttribute('y2',H-pb);
      line.setAttribute('stroke','#c9d1e3');line.setAttribute('stroke-dasharray','3 3');
      line.setAttribute('class','hover-line');
      svgEl.appendChild(line);
    });
    hz.addEventListener('mouseleave',()=>{tooltip().style.display='none';
      const hl=wrap.querySelector('.hover-line');if(hl)hl.remove();});
    overlay.appendChild(hz);
  });
  el.style.position='relative';
  el.appendChild(wrap);el.appendChild(overlay);
}
function movingAvg(arr,w){
  return arr.map((_,i)=>{
    const s=arr.slice(Math.max(0,i-w+1),i+1).filter(v=>v!=null);
    return s.length?+ (s.reduce((a,b)=>a+b,0)/s.length).toFixed(4):null;
  });
}

/* 堆叠面积图（财务全景增强） */
function renderStackedArea(el,labels,series){
  if(!el)return;
  const W=Math.max(el.clientWidth||760,320),H=240;
  const pl=50,pr=14,pt=14,pb=28,n=labels.length;
  if(!n){el.innerHTML='<div class="empty" style="padding:40px">暂无数据</div>';return;}
  /* 计算每个 x 位置的累计值 */
  const stacks=[];
  for(let i=0;i<n;i++){
    let cum=0;const arr=[];
    for(const s of series){
      const v=+(s.values[i]||0);
      cum+=v;arr.push({v,start:cum-v,end:cum});
    }
    stacks.push(arr);
  }
  let maxV=0;
  stacks.forEach(arr=>arr.forEach(x=>{if(x.end>maxV)maxV=x.end;}));
  if(maxV<=0){el.innerHTML='<div class="empty" style="padding:40px">暂无费用数据</div>';return;}
  const X=i=>n===1?(pl+pr)/2:pl+(W-pl-pr)*i/(n-1);
  const Y=v=>pt+(H-pt-pb)*(1-v/maxV);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  /* 网格 */
  for(let g=0;g<=4;g++){
    const v=maxV*g/4,y=Y(v);
    svg+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#eef1f6"/>`;
    svg+=`<text x="${pl-7}" y="${y+3.5}" text-anchor="end" font-size="10" fill="#9aa3b2">${(v/1e4).toLocaleString('zh-CN',{maximumFractionDigits:0})}</text>`;
  }
  /* x 标签 */
  labels.forEach((l,i)=>{svg+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#9aa3b2">${esc(l)}</text>`;});
  /* 各序列的多边形路径 */
  series.forEach((s,si)=>{
    let path='';
    /* 顶层 */
    stacks.forEach((arr,i)=>{
      const p=arr[si];
      path+=(i===0?'M':'L')+X(i).toFixed(1)+' '+Y(p.end).toFixed(1)+' ';
    });
    /* 底层（从右到左） */
    for(let i=n-1;i>=0;i--){
      const p=stacks[i][si];
      path+='L'+X(i).toFixed(1)+' '+Y(p.start).toFixed(1)+' ';
    }
    path+='Z';
    svg+=`<path d="${path}" fill="${s.color}" fill-opacity=".72" stroke="${s.color}" stroke-width="1.5"/>`;
  });
  svg+='</svg>';
  const wrap=document.createElement('div');
  wrap.innerHTML=svg;
  const overlay=document.createElement('div');
  overlay.style.cssText='position:absolute;inset:0;display:flex;';
  labels.forEach((l,i)=>{
    const hz=document.createElement('div');
    hz.style.cssText='flex:1;cursor:crosshair';
    hz.addEventListener('mousemove',e=>{
      const tt=tooltip();
      let html=`<div class="tt-t">${esc(l)}</div>`;
      series.forEach(s=>{const v=s.values[i];
        html+=`<div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:5px"></span>${esc(s.n)}：${v==null?'—':fmtVal(v,'cny')}</div>`;});
      tt.innerHTML=html;tt.style.display='block';
      const tw=tt.offsetWidth;
      tt.style.left=Math.min(e.clientX+14,window.innerWidth-tw-10)+'px';
      tt.style.top=(e.clientY+14)+'px';
    });
    hz.addEventListener('mouseleave',()=>{tooltip().style.display='none';});
    overlay.appendChild(hz);
  });
  el.style.position='relative';
  el.innerHTML='';
  el.appendChild(wrap);el.appendChild(overlay);
}

/* 产品成本：优先用同步快照（state.products）；无则回落到内置 BOM 默认（OA供应商报价测算） */
function getProducts(){return (state.products&&state.products.items&&state.products.items.length)?state.products:BUILTIN_PRODUCTS;}
function prodIsBuiltin(){return !(state.products&&state.products.items&&state.products.items.length);}
let prodTab='overview';   // overview|items|quotes|suppliers
function prodItems(){return (getProducts()&&getProducts().items)||[];}
function prodQuoteStats(){return (getProducts()&&getProducts().quoteStats)||{};}
function prodMonths(){const pp=getProducts();return pp?{
  monthlyCost: pp.monthlyCost,
  monthlyRevenue: pp.monthlyRevenue,
  monthlyGrossProfit: pp.monthlyGrossProfit,
  monthlyPromoTotal: pp.monthlyPromoTotal||0,
  promoPeriod: pp.promoPeriod||null,
  promoPerUnitTotal: pp.promoPerUnitTotal||0,
  promoWindowSales: pp.promoWindowSales||0,
  overallMarginRate: pp.overallMarginRate,
  lastSync: pp.lastSync
}:null;}

function renderProducts(c){
  const p=getProducts();
  if(!p||!p.items||!p.items.length){
    c.innerHTML='<div class="card"><div class="empty"><div class="big">📦</div><p>暂无产品成本数据</p>'
      +'<p style="font-size:12px;color:var(--ink3)">在项目目录运行 <code>node sync-products.js</code>：导入供应商物料报价 + 产品 BOM Excel</p>'
      +'<p style="font-size:11.5px;color:var(--ink3);margin-top:6px">需要 <code>供应商物料报价.xlsx</code> + <code>products.xlsx</code> 两个文件</p></div></div>';
    return;
  }
  const tabs=[['overview','📊 总览'],['items','💄 产品明细'],['quotes','🔩 物料报价'],['suppliers','🏭 供应商']];
  let html='<div class="card" style="margin-bottom:14px"><div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px">'
    +'<div class="bar-title" style="margin:0">产品成本 <span class="sub">口径：按 BOM × 各组件最低供应商报价 × 预估月销量</span></div>'
    +'<div class="seg no-print" style="margin-left:auto">'+tabs.map(t=>`<a class="${prodTab===t[0]?'on':''}" onclick="prodTab='${t[0]}';render()">${t[1]}</a>`).join('')+'</div></div>'
    +`<div style="font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.7">${prodIsBuiltin()?'<b style="color:#b9770e">📌 当前为内置 BOM 默认成本（OA供应商报价测算·含天地盖包装盒），月销量按等权估算；跑 <code>node sync-products.js</code> 导入真实 products.xlsx 后自动替换。</b><br>':''}⚠️ 单瓶成本 = BOM 各组件供应商报价之和（含水体/瓶/喷头/盖/标贴/底标/天地盖盒，不含灌装/物流/人工/损耗）。月销量来自「预估月销量」列；售价按均价 ¥120 估算月收入/毛利。最后同步：${p.lastSync?new Date(p.lastSync).toLocaleString('zh-CN'):(prodIsBuiltin()?'内置默认':'—')}。</div></div>`;

  if(prodTab==='overview')  html+=prodViewOverview();
  if(prodTab==='items')     html+=prodViewItems();
  if(prodTab==='quotes')    html+=prodViewQuotes();
  if(prodTab==='suppliers') html+=prodViewSuppliers();

  c.innerHTML=html;

  // 图表在 innerHTML 落地后渲染
  if(prodTab==='overview'){
    const items=prodItems();
    const labels=items.map(i=>i.name);
    renderChart($('#prodCostBar'),labels,[
      {name:'物料',values:items.map(i=>i.unit_cost),color:'#e8790a'},
      {name:'推广',values:items.map(i=>i.promo_per_unit||0),color:'#f5b93d'},
      {name:'真实毛利',values:items.map(i=>i.real_margin!=null?i.real_margin:i.margin),color:'#22a06b'}
    ],'cny');
    const lineAgg = items.reduce((m,i)=>{if(i.product_line)m[i.product_line]=(m[i.product_line]||0)+i.monthly_revenue;return m;},{});
    renderDonut($('#prodLineDonut'), Object.keys(lineAgg).map(k=>({plat:k, gmv:lineAgg[k]})),'产品线收入占比');
  }
}

/* ===== 总览 ===== */
function prodViewOverview(){
  const p=prodMonths();
  const items=prodItems();
  const lines=[...new Set(items.map(i=>i.product_line).filter(Boolean))];

  const totalEstQty = items.reduce((a,i)=>a+(i.est_monthly_qty||0),0);
  const promoPerUnit = p.promoPerUnitTotal || 0;
  // 月推广分摊（按预估销量滚动，保持与「单瓶真实毛利率」口径一致）= 单瓶推广 × 预估月销量
  const scaledPromo = +(promoPerUnit * totalEstQty).toFixed(2);
  const realMarginRate = p.monthlyRevenue > 0 && p.monthlyCost != null
    ? +((p.monthlyRevenue - p.monthlyCost - scaledPromo) / p.monthlyRevenue * 100).toFixed(2)
    : null;

  const kpi=[
    ['月总收入（估算）',fmoney(p.monthlyRevenue),'c-blue',`${items.length} 款产品 · ${totalEstQty} 瓶/月`],
    ['月物料成本',fmoney(p.monthlyCost),'c-red','BOM × 各组件最低报价（不含试香）'],
    ['月推广分摊',fmoney(scaledPromo),'c-orange',`单瓶 ¥${promoPerUnit.toFixed(2)} × 预估月销 ${totalEstQty} 瓶`],
    ['月真实毛利',fmoney(p.monthlyRevenue - p.monthlyCost - scaledPromo),realMarginRate>=70?'c-green':(realMarginRate>=55?'c-blue':'c-red'),'收入 − 物料 − 推广分摊'],
    ['物料毛利率',fpct(p.overallMarginRate),p.overallMarginRate>=80?'c-green':'c-blue','仅扣物料成本，未扣推广/退款'],
    ['综合真实毛利率',realMarginRate!=null?fpct(realMarginRate):'—',realMarginRate!=null&&realMarginRate>=70?'c-green':(realMarginRate>=55?'c-blue':'c-red'),'(售价−物料−单瓶推广) ÷ 售价'],
  ];
  let h='<div class="dkpis">'+kpi.map(([n,v,cls,desc])=>
    `<div class="dkpi"><div class="k">${n}</div><div class="v ${cls}">${v}</div><div class="kpi-desc" style="margin-top:4px">${desc}</div></div>`).join('')+'</div>';

  if(p.promoPeriod){
    h+='<div class="kpi-note" style="font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.7">'
      +`📊 推广分摊口径：逐日 <b>总推广支出 ÷ 当日总销量</b>。${p.promoPeriod} 完整月实测 推广 ${fmoney(p.monthlyPromoTotal||0)} ÷ 销量 ${p.promoWindowSales||0} 瓶 = <b>单瓶 ${fmoney(promoPerUnit)}</b>；`
      +`月推广分摊按预估月销量 ${totalEstQty} 瓶滚动为 ${fmoney(scaledPromo)}（实际月销量约 ${p.promoWindowSales||0} 瓶，故月度口径偏保守）。</div>`;
  }

  h+='<div class="duo-grid">'
    +'<div class="card"><div class="bar-title">各产品物料/推广/真实毛利 <span class="sub">物料=不含试香 BOM · 推广=逐日总推广÷当日总销量 · 真实毛利=收入−物料−单瓶推广</span></div><div class="chart-box" id="prodCostBar"></div></div>'
    +'<div class="card"><div class="bar-title">产品线收入占比 <span class="sub">按产品线分组月收入</span></div><div class="donut-wrap" id="prodLineDonut"></div></div>'
    +'</div>';

  // 产品线小汇总表
  h+='<div class="card"><h3>按产品线汇总 <span class="sub">BOM 测算 · 单位：元 / 月</span></h3><div style="overflow-x:auto"><table class="rt sumtable"><thead><tr>'
    +'<th>产品线</th><th style="text-align:right">产品数</th><th style="text-align:right">月销量(瓶)</th>'
    +'<th style="text-align:right">月收入</th><th style="text-align:right">月成本</th><th style="text-align:right">月毛利</th><th style="text-align:right">毛利率</th></tr></thead><tbody>';
  for(const line of lines){
    const sub=items.filter(i=>i.product_line===line);
    const sum=k=>sub.reduce((a,i)=>a+(i['monthly_'+k]||0),0);
    const rev=sum('revenue'),cost=sum('cost'),gp=sum('gross_profit');
    const qty=sub.reduce((a,i)=>a+(i.est_monthly_qty||0),0);
    const mr=rev>0?gp/rev*100:0;
    h+=`<tr><td>${esc(line)}</td><td style="text-align:right">${sub.length}</td><td style="text-align:right">${qty}</td>`
      +`<td style="text-align:right">${fmoney(rev)}</td><td style="text-align:right;color:#f54a45">${fmoney(cost)}</td>`
      +`<td style="text-align:right;font-weight:600;color:${gp>=0?'#1e9e62':'#f54a45'}">${fmoney(gp)}</td>`
      +`<td style="text-align:right;font-weight:600;color:${mr>=90?'#1e9e62':'#f54a45'}">${fpct(mr)}</td></tr>`;
  }
  const sumRev=p.monthlyRevenue,sumCost=p.monthlyCost,sumGp=p.monthlyGrossProfit;
  h+=`<tr style="font-weight:600;background:var(--accent-weak,#eef3fd)"><td>合计</td><td style="text-align:right">${items.length}</td><td style="text-align:right">${items.reduce((a,i)=>a+(i.est_monthly_qty||0),0)}</td>`
    +`<td style="text-align:right">${fmoney(sumRev)}</td><td style="text-align:right;color:#f54a45">${fmoney(sumCost)}</td>`
    +`<td style="text-align:right;color:#1e9e62">${fmoney(sumGp)}</td><td style="text-align:right;color:#1e9e62">${fpct(p.overallMarginRate)}</td></tr>`;
  h+='</tbody></table></div></div>';

  // 自动洞察
  const sortedByMargin=[...items].sort((a,b)=>(b.margin_rate||0)-(a.margin_rate||0));
  const sortedByCost=[...items].sort((a,b)=>(b.unit_cost||0)-(a.unit_cost||0));
  const cheapestUnit=items.filter(i=>i.unit_cost>0).sort((a,b)=>a.unit_cost-b.unit_cost)[0];
  const dearestUnit=[...items].sort((a,b)=>b.unit_cost-a.unit_cost)[0];
  const ins=[];
  ins.push(`📦 ${items.length} 款产品 <b>${items.reduce((a,i)=>a+(i.est_monthly_qty||0),0)}</b> 瓶/月，预估月收入 <b>${fmoney(sumRev)}</b>，物料成本 <b>${fmoney(sumCost)}</b>，月毛利 <b>${fmoney(sumGp)}</b>，综合毛利率 <b>${fpct(p.overallMarginRate)}</b>。`);
  if(cheapestUnit)ins.push(`💡 单瓶成本最低：<b>${esc(cheapestUnit.name)}</b> ¥${cheapestUnit.unit_cost.toFixed(2)}（毛利率 ${(cheapestUnit.margin_rate||0).toFixed(2)}%）；成本最高：<b>${esc(dearestUnit.name)}</b> ¥${dearestUnit.unit_cost.toFixed(2)}（${(dearestUnit.margin_rate||0).toFixed(2)}%）。`);
  if(sortedByMargin[0])ins.push(`🏆 毛利率冠军：<b>${esc(sortedByMargin[0].name)}</b> ${(sortedByMargin[0].margin_rate||0).toFixed(2)}%；毛利率最低：<b>${esc(sortedByMargin[sortedByMargin.length-1].name)}</b> ${(sortedByMargin[sortedByMargin.length-1].margin_rate||0).toFixed(2)}%。`);
  h+='<div class="card"><div class="bar-title">产品成本洞察 <span class="sub">自动生成</span></div>'
    +'<ul style="margin:0;padding-left:18px;line-height:2;font-size:13px">'+ins.map(s=>`<li>${s}</li>`).join('')+'</ul></div>';

  /* ---------- BCG 矩阵（产品经营增强） ---------- */
  /* X 轴：相对市场份额 = 单品月销量 / 总月销量  ·  Y 轴：增长率 = 月收入环比（用最近 2 个月对比，无数据则取毛利率替代） */
  const totQty=items.reduce((a,i)=>a+(i.est_monthly_qty||0),0)||1;
  const maxShare=Math.max(...items.map(i=>i.est_monthly_qty/totQty),0.01);
  const maxGrowth=Math.max(...items.map(i=>Math.abs(i.margin_rate||0)),1);
  /* 用毛利率做"增长率"代理变量（无月度时间序列数据），并用相对市场份额做 X */
  const bcgPoints=items.map((it,i)=>{
    const share=it.est_monthly_qty/totQty;
    const growth=it.margin_rate||0;
    const cxPct=share/maxShare*100;            // 0~100
    const cyPct=Math.max(0,Math.min(100,growth/maxGrowth*100));
    let q=1; // 1:左上明星 2:右上金牛 3:左下问号 4:右下瘦狗
    if(cxPct>=50&&cyPct>=50)q=1;
    else if(cxPct>=50&&cyPct<50)q=2;
    else if(cxPct<50&&cyPct>=50)q=3;
    else q=4;
    return {name:it.name,share,growth,cx:cxPct,cy:cyPct,q,color:q===1?'#3370ff':q===2?'#1e9e62':q===3?'#ff8800':'#9aa3b2'};
  });
  const bcgHtml=`<div class="card">
    <div class="bar-title">📊 BCG 矩阵 <span class="sub">X=相对市场份额 · Y=毛利率</span>
      <span style="margin-left:auto"><span class="est-tag">估算</span></span></div>
    <div class="bcg-wrap">
      <div class="bcg-grid">
        <div class="bcg-cell q1"><div class="lbl">⭐ 明星</div><div class="sub">高份额 · 高毛利</div></div>

      </div>
      ${bcgPoints.map((p,i)=>`<div class="bcg-pt" style="left:calc(${p.cx}% - 18px);top:calc(${100-p.cy}% - 18px);background:${p.color};z-index:${10-i}"
        title="${esc(p.name)}：份额 ${(p.share*100).toFixed(1)}% · 毛利率 ${p.growth.toFixed(1)}%">${p.name.slice(0,2)}</div>`).join('')}

      <div class="bcg-axis-y" style="left:-32px;top:50%;transform:rotate(-90deg) translateX(50%)">毛利率 ↑</div>
    </div>
    <div class="hint">BCG 矩阵按相对市场份额 × 毛利率将产品分为 4 类。明星加投、金牛维稳、问号观察、瘦狗考虑淘汰或降价。</div>
  </div>`;

  /* ---------- SKU 生命周期（演示用：按销量分档归类） ---------- */
  /* 假设生命周期：导入期(0-20%) / 成长期(20-50%) / 成熟期(50-80%) / 衰退期(<10% 且毛利低) / 清仓期(<5%) */
  const lifecycle=items.map(it=>{
    const share=it.est_monthly_qty/totQty*100;
    const mr=it.margin_rate||0;
    if(share<5)return {n:it.name,stage:'清仓期',emo:'🗑️',cls:'lc-clear',sub:'销量份额 < 5%'};
    if(mr<60&&share<10)return {n:it.name,stage:'衰退期',emo:'📉',cls:'lc-decline',sub:`份额 ${share.toFixed(1)}% · 毛利 ${mr.toFixed(1)}%`};
    if(share<20)return {n:it.name,stage:'导入期',emo:'🚀',cls:'lc-launch',sub:`份额 ${share.toFixed(1)}%`};
    if(share<50)return {n:it.name,stage:'成长期',emo:'📈',cls:'lc-grow',sub:`份额 ${share.toFixed(1)}%`};
    return {n:it.name,stage:'成熟期',emo:'💎',cls:'lc-mature',sub:`份额 ${share.toFixed(1)}% · 毛利 ${mr.toFixed(1)}%`};
  });
  const stageCount=lifecycle.reduce((m,x)=>{m[x.stage]=(m[x.stage]||0)+1;return m;},{});
  const lcHtml=`<div class="card">
    <div class="bar-title">🌱 SKU 生命周期 <span class="sub">按销量份额 + 毛利率归类</span>
      <span style="margin-left:auto"><span class="est-tag">估算</span></span></div>
    <div class="lifecycle">
      <div class="lc-card lc-launch"><div class="lc-emo">🚀</div><div class="lc-n">${stageCount['导入期']||0}</div><div class="lc-l">导入期 SKU</div></div>
      <div class="lc-card lc-grow"><div class="lc-emo">📈</div><div class="lc-n">${stageCount['成长期']||0}</div><div class="lc-l">成长期 SKU</div></div>
      <div class="lc-card lc-mature"><div class="lc-emo">💎</div><div class="lc-n">${stageCount['成熟期']||0}</div><div class="lc-l">成熟期 SKU</div></div>
      <div class="lc-card lc-decline"><div class="lc-emo">📉</div><div class="lc-n">${stageCount['衰退期']||0}</div><div class="lc-l">衰退期 SKU</div></div>
      <div class="lc-card lc-clear"><div class="lc-emo">🗑️</div><div class="lc-n">${stageCount['清仓期']||0}</div><div class="lc-l">清仓期 SKU</div></div>
    </div>
    <div style="margin-top:12px;font-size:12.5px;color:var(--ink2);line-height:1.8">
      ${lifecycle.map(x=>`<span style="display:inline-block;margin:2px 6px 2px 0;padding:3px 10px;border-radius:14px;background:${x.cls==='lc-launch'?'#fff7e6':x.cls==='lc-grow'?'#e6f6ed':x.cls==='lc-mature'?'#eef1fe':x.cls==='lc-decline'?'#fdecee':'#f0f2f7'}">${x.emo} ${esc(x.n)} <span style="color:var(--ink3);margin-left:4px">${x.stage}</span></span>`).join('')}
    </div>
  </div>`;

  /* ---------- 推广效率排名（推广分摊 vs 真实毛利） ---------- */
  const promoEff=items.map(it=>{
    const promo=+(it.promo_per_unit||0);
    const rev=+(it.monthly_revenue||0);
    const cost=+(it.monthly_cost||0)+(it.est_monthly_qty||0)*promo;
    const gp=rev-cost;
    const promoCost=(it.est_monthly_qty||0)*promo;
    const eff=promoCost>0?(gp/promoCost*100):null;     // 每元推广产出的毛利
    return {name:it.name,promo,promoCost,gp,eff,share:it.est_monthly_qty/totQty*100};
  }).sort((a,b)=>(b.eff||0)-(a.eff||0));
  const maxEff=Math.max(...promoEff.map(x=>x.eff||0),1);
  const promoHtml=`<div class="card">
    <div class="bar-title">🚀 推广效率排名 <span class="sub">每元推广产出毛利（毛利率 ÷ 推广占比）</span>
      <span style="margin-left:auto"><span class="est-tag">估算</span></span></div>
    <div style="overflow-x:auto"><table class="rt"><thead><tr>
      <th>排名</th><th>产品</th><th style="text-align:right">单瓶推广</th><th style="text-align:right">月推广分摊</th>

    </tr></thead><tbody>${promoEff.map((d,i)=>`<tr>
      <td><b style="color:#3370ff">${i+1}</b></td>
      <td><b>${esc(d.name)}</b></td>
      <td style="text-align:right;color:#e8790a">¥${d.promo.toFixed(2)}</td>
      <td style="text-align:right;color:#f54a45">${fmoney(d.promoCost)}</td>

      <td style="text-align:right"><b style="color:${d.eff>=100?'#1e9e62':d.eff>=0?'#3370ff':'#f54a45'}">${d.eff!=null?d.eff.toFixed(1)+'%':'—'}</b></td>
      <td><div style="display:flex;align-items:center;gap:6px"><div class="conc-bar" style="width:80px"><div class="fill" style="width:${Math.min(100,Math.max(0,(d.eff||0)/maxEff*100)).toFixed(1)}%;background:${d.eff>=100?'#1e9e62':d.eff>=0?'#3370ff':'#f54a45'}"></div></div></div></td>
    </tr>`).join('')}</tbody></table></div>
    <div class="hint">推广效率 = 月真实毛利 ÷ 月推广分摊。≥ 100% 表明每 1 元推广投入产出 ≥ 1 元毛利（健康）·&lt; 0 表明推广亏损。</div>
  </div>`;

  h+=bcgHtml+lcHtml+promoHtml;
  return h;
}

/* ============================================================
   渠道经营（新增模块）
   ============================================================ */
function channelHealthScore(ch){
  /* 渠道健康评分：综合 ROI / 退款率 / 销量占比 / 增长率 4 个维度
     每个维度满分 25，总分 100；纯算法演示，估算数据已标"估算" */
  const rows=dashRows();
  if(!rows.length)return null;
  const gmv=sumCol(rows,ch+'收入'),spend=sumCol(rows,ch+'推广支出'),
        refund=sumCol(rows,ch+'退款'),qty=sumCol(rows,ch+'销量'),
        totGmv=sumCol(rows,'总收入');
  const roi=spend>0&&gmv>0?gmv/spend:null;
  const refundRatio=gmv>0?refund/gmv*100:0;
  const share=totGmv>0?gmv/totGmv*100:0;
  /* 增长率：与上期相比 */
  const prev=prevDashRows();
  let growth=0;
  if(prev){
    const pGmv=sumCol(prev,ch+'收入');
    growth=pGmv>0?(gmv-pGmv)/pGmv*100:0;
  }
  /* 各维度分（0-25） */
  const roiScore=roi==null?15:Math.min(25,Math.max(0,roi*8));           // 无投放(自然流量)给中性 15 分；ROI 1.0=8 分，3.0=24
  const refundScore=Math.min(25,Math.max(0,25-refundRatio*1.2)); // 退款率 0%=25，20%=1
  const shareScore=Math.min(25,share*0.7);                 // 占比 35% = 24.5
  const growthScore=Math.min(25,Math.max(0,12.5+growth*0.4)); // 0% 增长 = 12.5，30% = 24.5
  const total=Math.round(roiScore+refundScore+shareScore+growthScore);
  return {ch,gmv,spend,refund,qty,share,roi,refundRatio,growth,
    dims:[
      {n:'ROI 表现',v:roi,score:Math.round(roiScore),max:25,fmt:v=>v!=null?v.toFixed(2):'—',good:v=>v>=2},
      {n:'退款控制',v:refundRatio,score:Math.round(refundScore),max:25,fmt:v=>v.toFixed(1)+'%',good:v=>v<=10,invert:true},
      {n:'销量占比',v:share,score:Math.round(shareScore),max:25,fmt:v=>v.toFixed(1)+'%',good:v=>v>=10},
      {n:'同比增速',v:growth,score:Math.round(growthScore),max:25,fmt:v=>(v>=0?'+':'')+v.toFixed(1)+'%',good:v=>v>=5}
    ],total,status:total>=80?'优':total>=60?'良':total>=40?'关注':'预警'};
}

  const healthData=chs.map(ch=>channelHealthScore(ch)).filter(Boolean).sort((a,b)=>b.total-a.total);
  const chColors={'淘宝':'#ff6a00','抖音':'#000000','拼多多':'#e02020','小红书':'#ff2442','tiktok':'#333333'};
  const healthHtml=`<div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${
    healthData.map(h=>{
      const stat=h.total>=80?'good':h.total>=60?'flat':h.total>=40?'warn':'bad';
      const statLbl={good:'健康',flat:'一般',warn:'关注',bad:'预警'}[stat];
      const statBg={good:'#e6f6ed',flat:'#eef1fe',warn:'#fff7e6',bad:'#fdecee'}[stat];
      const statFg={good:'#1e9e62',flat:'#3370ff',warn:'#c77c1a',bad:'#d5384a'}[stat];
      return `<div class="ch-card">
        <div class="ch-head">
