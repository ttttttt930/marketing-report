        </div>
        <div class="ch-row"><span>GMV</span><b>${fmtCny(h.gmv)}</b></div>
        <div class="ch-row"><span>推广消耗</span><b style="color:#f54a45">${fmtCny(h.spend)}</b></div>
        <div class="ch-row"><span>销量</span><b>${h.qty.toLocaleString('zh-CN')} 瓶</b></div>
        <div class="ch-row"><span>ROI</span><b style="color:${h.roi==null?'var(--ink3)':h.roi>=2?'#1e9e62':h.roi>=1?'#3370ff':'#f54a45'}">${h.roi!=null?h.roi.toFixed(2):'—'}</b></div>
        <div class="ch-foot"><span>占比 ${h.share.toFixed(1)}%</span><span>退款率 ${h.refundRatio.toFixed(1)}%</span></div>
      </div>`;
    }).join('')
  }</div>`;

  /* 集中度风险：HHI 指数 = Σ(各渠道占比%)²，>2500 高度集中 */
  const totGmv=chs.reduce((a,ch)=>a+sumCol(dashRows(),ch+'收入'),0);
  const hhi=chs.reduce((a,ch)=>{const s=totGmv>0?sumCol(dashRows(),ch+'收入')/totGmv*100:0;return a+s*s;},0);
  const topCh=chs.length?chs.reduce((a,ch)=>sumCol(dashRows(),ch+'收入')>sumCol(dashRows(),a+'收入')?ch:a,chs[0]):null;
  const topPct=topCh?sumCol(dashRows(),topCh+'收入')/totGmv*100:0;
  const concLevel=hhi>2500?'高':hhi>1800?'中':'低';
  const concColor=hhi>2500?'#f54a45':hhi>1800?'#ff8800':'#1e9e62';
  const concHtml=`<div class="card">
    <div class="bar-title">⚖️ 渠道集中度风险 <span class="sub">HHI 赫芬达尔指数</span>
      <span style="margin-left:auto"><span class="est-tag">估算</span></span></div>
    <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:14px">
      <div>
        <div style="font-size:11.5px;color:var(--ink3)">HHI 指数</div>
        <div style="font-size:30px;font-weight:700;color:${concColor};font-variant-numeric:tabular-nums">${hhi.toFixed(0)}</div>
        <div style="font-size:12px;color:var(--ink2)">集中度等级：<b style="color:${concColor}">${concLevel}</b></div>
      </div>
      <div>
        <div style="font-size:11.5px;color:var(--ink3)">头部渠道</div>
        <div style="font-size:18px;font-weight:700">${esc(topCh||'—')}</div>
        <div style="font-size:12px;color:var(--ink2)">占比 <b>${topPct.toFixed(1)}%</b></div>
      </div>
      <div style="flex:1;min-width:200px">
        ${chs.map(ch=>{
          const s=totGmv>0?sumCol(dashRows(),ch+'收入')/totGmv*100:0;
          return `<div style="display:flex;align-items:center;gap:10px;margin:5px 0;font-size:12.5px">
            <span style="width:60px;color:var(--ink2)">${esc(ch)}</span>
            <div class="conc-bar" style="flex:1"><div class="fill" style="width:${s.toFixed(1)}%;background:${chColors[ch]||'#888'}"></div></div>
            <span style="width:64px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">${s.toFixed(1)}%</span>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="hint">HHI = Σ(各渠道 GMV 占比%²)。HHI &lt; 1800 低集中（健康）· 1800-2500 中集中（关注）· &gt; 2500 高集中（依赖单一渠道，建议分散）。本指标用于战略层判断，非财务核算依据。</div>
  </div>`;

  /* 真实 ROI 排名（含估算 BOM 单瓶物料 × 销量） */
  const rs=prodItems().length?periodRealStats(dashRows()):null;
  const chRoiRows=chs.map(ch=>{
    const gmv=sumCol(dashRows(),ch+'收入'),spend=sumCol(dashRows(),ch+'推广支出'),
          refund=sumCol(dashRows(),ch+'退款'),profit=sumCol(dashRows(),ch+'净收入'),qty=sumCol(dashRows(),ch+'销量');
    /* 真实 ROI = 渠道GMV ÷ (渠道推广 + 物料成本分摊) */
    const matShare=rs&&rs.materialCost?(qty/rs.qty)*rs.materialCost:0;
    const realCost=spend+matShare;
    const realRoi=realCost>0?gmv/realCost:null;
    const advRoi=spend>0?gmv/spend:null;
    return {ch,gmv,spend,refund,profit,qty,matShare,realRoi,advRoi};
  }).filter(d=>d.gmv>0||d.spend>0).sort((a,b)=>(b.realRoi||0)-(a.realRoi||0));
  const maxRealRoi=chRoiRows.length?Math.max(...chRoiRows.map(d=>d.realRoi||0),1):1;
  const roiHtml=`<div class="card">
    <div class="bar-title">🏆 渠道真实 ROI 排名 <span class="sub">GMV ÷ (推广 + 物料分摊)</span>
      <span style="margin-left:auto"><span class="est-tag">估算</span></span></div>
    <div style="overflow-x:auto"><table class="rt"><thead><tr>
      <th>排名</th><th>渠道</th><th style="text-align:right">GMV</th><th style="text-align:right">推广</th>
      <th style="text-align:right">物料分摊</th><th style="text-align:right">真实投入</th><th style="text-align:right">真实 ROI</th>
      <th style="text-align:right">投放 ROI</th>
    </tr></thead><tbody>${
      chRoiRows.map((d,i)=>{
        const barW=d.realRoi?Math.min(100,d.realRoi/maxRealRoi*100):0;
        return `<tr>
          <td><b style="color:#3370ff">${i+1}</b></td>
          <td><span class="pdot" style="background:${chColors[d.ch]||'#888'}"></span>${esc(d.ch)}</td>
          <td style="text-align:right;color:#3370ff">${fmtCny(d.gmv)}</td>
          <td style="text-align:right;color:#f54a45">${fmtCny(d.spend)}</td>
          <td style="text-align:right;color:#c77c1a">${fmtCny(d.matShare)}</td>
          <td style="text-align:right"><b>${fmtCny(d.spend+d.matShare)}</b></td>
          <td style="text-align:right"><b style="color:${d.realRoi>=2?'#1e9e62':d.realRoi>=1?'#3370ff':'#f54a45'}">${d.realRoi!=null?d.realRoi.toFixed(2):'—'}</b></td>
          <td style="text-align:right;color:var(--ink3)">${d.advRoi!=null?d.advRoi.toFixed(2):'—'}</td>
        </tr>`;
      }).join('')
    }</tbody></table></div>
    <div class="hint">真实 ROI = 渠道 GMV ÷ (渠道推广支出 + 按销量占比分摊的全平台物料成本)。投放 ROI 仅看推广效率，未计入物料成本，建议以真实 ROI 为主指标。</div>
  </div>`;

  c.innerHTML=`
    <div class="filterbar no-print">
      <div class="frow"><span class="flabel">时间</span><div class="seg" id="segTime">${[['today','今日'],['week','本周'],['month','本月'],['year','本年'],['all','全部']].map(([k,l])=>`<a data-t="${k}" class="${dashTime===k?'on':''}">${l}</a>`).join('')}</div><span class="hint" style="margin:0">${esc(dashRangeLabel())}</span></div>
    </div>
    <div class="section-h">📊 渠道健康卡 <span class="section-sub">${chs.length} 个渠道 · 综合 ROI/退款/占比/增长 4 维评分</span></div>
    ${healthHtml}
    ${concHtml}
    ${roiHtml}
  `;
  c.querySelectorAll('#segTime a').forEach(a=>a.onclick=()=>{dashTime=a.dataset.t;render();});
}

/* ============================================================
   供应链（新增模块）
   ============================================================ */
function renderSupplyChain(c){
  if(!prodItems().length){
    c.innerHTML='<div class="card"><div class="empty"><div class="big">🏭</div><p>暂无供应链数据</p>'
      +'<p style="font-size:12px;color:var(--ink3)">先在项目目录运行 <code>node sync-products.js</code>：导入供应商物料报价 + 产品 BOM Excel</p></div></div>';
    return;
  }
  const items=prodItems();
  const qs=prodQuoteStats();
  const pm=prodMonths();

  /* 供应商集中度：按所有产品的最低报价来源汇总 */
  /* 每条 quote 由 supplier + component，统计该供应商被多少 SKU 选中为最低价 */
  /* quoteStats 是 component→supplier→price 的映射；这里直接聚合 supplier 在 items 里出现的次数 */
  const supplierHits={};
  for(const it of items){
    /* 从 items 里提取每个组件的供应商（如果有）—— 用 quoteStats 反查 */
    if(it.bom&&Array.isArray(it.bom)){
      for(const c of it.bom){
        if(c.supplier&&c.qty){
          supplierHits[c.supplier]=(supplierHits[c.supplier]||0)+1;
        }
      }
    }
  }
  /* 若 BOM 没有 supplier 字段，从 quoteStats.component 维度聚合（按组件类型加权） */
  if(!Object.keys(supplierHits).length){
    for(const comp in qs){
      const list=qs[comp]||[];
      if(list.length){
        /* 取最低价供应商 */
        const min=list.reduce((a,b)=>(b.price||0)<(a.price||0)?b:a);
        if(min.supplier){
          supplierHits[min.supplier]=(supplierHits[min.supplier]||0)+1;
        }
      }
    }
  }
  const supplierArr=Object.entries(supplierHits).map(([n,c])=>({name:n,count:c}));
  supplierArr.sort((a,b)=>b.count-a.count);
  const supplierTot=supplierArr.reduce((a,s)=>a+s.count,0)||1;
  const topSup=supplierArr[0];
  const topPct=topSup?topSup.count/supplierTot*100:0;
  const supShi=supplierArr.reduce((a,s)=>a+(s.count/supplierTot*100)*(s.count/supplierTot*100),0); // HHI 类似
  const supLevel=supShi>2500?'高':supShi>1800?'中':'低';

  /* BOM 成本瀑布：取 BOM 组件数最多的一款 SKU 做演示（单 SKU 拆解，暂无切换交互） */
  /* items 里 unit_cost = BOM 最低价合计，这里拆解为每个组件的金额（用 quoteStats.component 最低价 × 用量） */
  const itemsWithBom=items.filter(it=>it.bom&&Array.isArray(it.bom)&&it.bom.length);
  /* 选 BOM 最丰富的 SKU 演示（组件数最多） */
  let demoItem=itemsWithBom.length?itemsWithBom[0]:null;
  for(const it of itemsWithBom){if(it.bom.length>demoItem.bom.length)demoItem=it;}

  /* 库存预警：基于 est_monthly_qty × 假设安全库存 2 个月，低于 1.5 个月即告警 */
  /* 月实际销量取最近一个完整月（state.rows 倒数第二个月） */
  let monthlySales={};
  if(state.rows.length){
    /* 按日期分月分组，对每个月取 SKU 销量（没有 SKU 列，用总销量按 est_monthly_qty 比例均分） */
    const monthGroups=groupBy(state.rows,r=>r.date.slice(0,7));
    const months=Object.keys(monthGroups).sort();
    if(months.length>=2){
      const last=months[months.length-2]; // 上一个完整月
      const totQty=group => group.reduce((a,r)=>a+(+r.values['总销量']||0),0);
      const tq=totQty(monthGroups[last]);
      const totEst=items.reduce((a,i)=>a+(+i.est_monthly_qty||0),0)||1;
      for(const it of items){
        monthlySales[it.name]=(+it.est_monthly_qty||0)*(tq/totEst);  // 估算该 SKU 月销
      }
    }
  }

  /* 渲染 */
  const fmtCny=v=>'¥'+(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const supHtml=`<div class="card">
    <div class="bar-title">🏭 供应商集中度 <span class="sub">${supplierArr.length} 家供应商 · 按最低报价入选次数</span>
      <span style="margin-left:auto"><span class="est-tag">估算</span></span></div>
    <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px">
      <div>
        <div style="font-size:11.5px;color:var(--ink3)">头部供应商</div>
        <div style="font-size:18px;font-weight:700">${esc(topSup?topSup.name:'—')}</div>
        <div style="font-size:12px;color:var(--ink2)">占比 <b style="color:#f54a45">${topPct.toFixed(1)}%</b></div>
      </div>
      <div>
        <div style="font-size:11.5px;color:var(--ink3)">集中度等级</div>
        <div style="font-size:18px;font-weight:700;color:${supLevel==='高'?'#f54a45':supLevel==='中'?'#ff8800':'#1e9e62'}">${supLevel}</div>
        <div style="font-size:12px;color:var(--ink2)">HHI 类似指数 ${supShi.toFixed(0)}</div>
      </div>
      <div style="flex:1;min-width:240px">
        ${supplierArr.slice(0,8).map(s=>{
          const pct=s.count/supplierTot*100;
          return `<div style="display:flex;align-items:center;gap:10px;margin:5px 0;font-size:12.5px">
            <span style="width:130px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</span>
            <div class="conc-bar" style="flex:1"><div class="fill" style="width:${pct.toFixed(1)}%;background:#3370ff"></div></div>
            <span style="width:50px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">${pct.toFixed(1)}%</span>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="hint">集中度高 → 任一供应商断供/涨价将直接冲击成本。建议至少保留 2-3 家可替代供应商。</div>
  </div>`;

  /* BOM 成本瀑布 */
  let bomHtml='';
  if(demoItem&&demoItem.bom&&demoItem.bom.length){
    const bomRows=demoItem.bom.map(c=>({n:c.name||c.component||'组件',v:(+c.qty||0)*(+c.min_price||0)}));
    const matTotal=bomRows.reduce((a,r)=>a+r.v,0);
    const packaging=+demoItem.unit_cost-matTotal; // 拆出包材估算（unit_cost 包含包材，BOM 只列原料）
    let cum=0;
    const cols=[{n:'物料成本',v:matTotal,kind:'total'}];
    if(packaging>0)cols.push({n:'包材/其它',v:packaging,kind:'pos'});
    /* 总价 = unit_cost */
    const waterfallCols=[];
    let running=0;
    for(let i=0;i<bomRows.length;i++){
      const r=bomRows[i];
      if(i===0){waterfallCols.push({n:r.n,v:r.v,kind:'pos',cum:r.v});running=r.v;continue;}
      waterfallCols.push({n:r.n,v:r.v,kind:'pos',cum:running+r.v});
      running+=r.v;
    }
    /* 包材段（如果有） */
    if(packaging>0){
      waterfallCols.push({n:'包材/其它',v:packaging,kind:'pos',cum:running+packaging});
      running+=packaging;
    }
    /* 起点 + 各段 + 终点 */
    const start={n:'0',v:0,kind:'base'};
    const segs=bomRows.map(r=>({n:r.n,v:r.v,kind:'pos'}));
    if(packaging>0)segs.push({n:'包材/其它',v:packaging,kind:'pos'});
    const end={n:'总成本',v:running,kind:'total'};
    const allCols=[start,...segs,end];
    const maxV=Math.max(...allCols.map(c=>c.v),1);
    bomHtml=`<div class="card">
      <div class="bar-title">📊 BOM 成本瀑布图 <span class="sub">演示：${esc(demoItem.name)} · 单瓶成本拆解</span>
        <span style="margin-left:auto"><span class="est-tag">估算</span></span></div>
      <div class="waterfall">${allCols.map(c=>{
        const h=c.v/maxV*180;
        const cls=c.kind==='total'?'wf-total':c.kind==='base'?'wf-base':'wf-pos';
        return `<div class="wf-col ${cls}">
          <div class="wf-val">${c.v>0?fmtCny(c.v):'—'}</div>
          <div class="wf-bar" style="height:${Math.max(2,h).toFixed(1)}px;background:${c.kind==='total'?'#3370ff':'#1e9e62'}"></div>
          <div class="wf-lbl">${esc(c.n)}</div>
        </div>`;
      }).join('')}</div>
      <div class="hint">单瓶物料成本 ${fmtCny(demoItem.unit_cost)} = 各组件用量 × 该组件最低供应商报价 + 包材/其它。颜色：绿色=正贡献，蓝色=合计。如需精确分摊，请用每款产品的 BOM 详情页。</div>
    </div>`;
  }

  /* 库存预警 */
  const invAlerts=[];
  for(const it of items){
    const est=+it.est_monthly_qty||0;
    const monthlySold=monthlySales[it.name]||est;
    /* 假设当前库存 = est_monthly_qty × 2（2 个月安全库存）；实际库存未在快照中提供 */
    const stock=est*2;
    const monthsCover=monthlySold>0?stock/monthlySold:99;
    let lvl='green',icon='✅',txt=`${esc(it.name)}：约覆盖 ${monthsCover.toFixed(1)} 个月销量（估算）`;
    if(monthsCover<1){lvl='red';icon='🚨';txt=`${esc(it.name)}：库存不足 1 个月，存在断货风险`;}
    else if(monthsCover<1.5){lvl='yellow';icon='⚠️';txt=`${esc(it.name)}：库存仅 ${monthsCover.toFixed(1)} 个月，建议补货`;}
    invAlerts.push({lvl,icon,txt});
  }
  /* 排序：红 > 黄 > 绿 */
  const order={red:0,yellow:1,green:2};
  invAlerts.sort((a,b)=>order[a.lvl]-order[b.lvl]);
  const invHtml=`<div class="card">
    <div class="bar-title">📦 库存覆盖模拟 <span class="sub">⚠️ 演示：暂无真实库存数据，按「预估月销 ×2」假设库存模拟，不代表真实库存</span>
      <span style="margin-left:auto"><span class="est-tag">估算</span></span></div>
    ${invAlerts.map(a=>`<div class="inv-alert ${a.lvl}"><span class="ia">${a.icon}</span><span>${esc(a.txt)}</span></div>`).join('')}
    <div class="hint">当前快照未提供实时库存字段，以上为按“预估月销量 × 2 = 假设库存”的模拟结果，不代表真实库存，请勿据此补货决策。接入 ERP/WMS 或手工录入库存后自动升级为真实预警。</div>
  </div>`;

  c.innerHTML=`
    ${supHtml}
    ${bomHtml}
    ${invHtml}
  `;
}
function finPeriodLabel(p){const[y,m]=p.split('-');return `${y} 年 ${+m} 月`;}
function finMShort(p){return (+p.split('-')[1])+'月';}
function finIsRows(){return (state.finance&&state.finance.incomeStatement)||[];}
function finPlatRows(){return (state.finance&&state.finance.platformProfit)||[];}
function finTbRows(){return (state.finance&&state.finance.trialBalance)||[];}
/* 科目余额聚合：exact=true 精确编码，否则按前缀匹配（视图内仅叶子科目） */
function tbBal(prefix,exact){const tb=finTbRows();return tb.filter(r=>exact?r.account_code===prefix:r.account_code.startsWith(prefix)).reduce((a,r)=>a+(r.balance||0),0);}
function tbSumType(type){return finTbRows().filter(r=>r.type===type).reduce((a,r)=>a+(r.balance||0),0);}
/* 营销运营口径（来自营销日报 state.rows，与会计口径并列展示） */
function finOps(){
  let gmv=0,refund=0,promo=0;
  for(const r of state.rows){const v=r.values||{};gmv+=v['总收入']||0;refund+=v['总退款']||0;promo+=v['总推广支出']||0;}
  return {gmv,refund,promo,
    refundRate:gmv>0?refund/gmv*100:0,
    promoRate:gmv>0?promo/gmv*100:0,
    net:gmv-refund-promo};
}
/* 环比：涨红跌绿（中国习惯） */
function finDelta(cur,prev){
  if(prev==null||!isFinite(prev)||Math.abs(prev)<0.005)return '<span style="color:var(--ink3)">—</span>';
  const d=(cur-prev)/Math.abs(prev)*100,up=d>=0;
  return `<span style="color:${up?'#f54a45':'#1e9e62'};font-weight:600">${up?'↗':'↘'} ${Math.abs(d).toFixed(2)}%</span>`;
}
/* 平台利润聚合：period=null 全期，否则指定月 */
function finPlatAgg(period){
  const m=new Map();
  for(const r of finPlatRows()){
    if(period&&r.period!==period)continue;
    if(!m.has(r.platform))m.set(r.platform,{plat:r.platform,income:0,promo:0,other:0});
    const o=m.get(r.platform);o.income+=r.income||0;o.promo+=r.promo||0;o.other+=r.other_selling||0;
  }
  const list=[...m.values()].map(d=>({plat:d.plat,income:d.income,promo:d.promo,other:d.other,
    gmv:d.income,spend:d.promo,roi:d.promo>0?d.income/d.promo:null}));
  list.sort((a,b)=>b.income-a.income);
  return list;
}
function finLatestPeriod(){const is=finIsRows();return is.length?is[is.length-1].period:null;}

/* ===== 财务总览 ===== */
function finViewOverview(){
  const is=finIsRows();
  const sum=k=>is.reduce((a,r)=>a+(r[k]||0),0);
  const rev=sum('rev'),net=sum('net'),selling=sum('selling');
  const promoAll=finPlatRows().reduce((a,r)=>a+(r.promo||0),0);
  const margin=rev>0?net/rev*100:0;
  const promoRate=rev>0?promoAll/rev*100:0;
  const latest=is[is.length-1],prev=is[is.length-2]||null;
  const tb=finTbRows();
  const dTot=tb.reduce((a,r)=>a+(r.debit_total||0),0),cTot=tb.reduce((a,r)=>a+(r.credit_total||0),0);
  const balanced=Math.abs(dTot-cTot)<0.01;
  const ops=finOps();
  const latestPer=finLatestPeriod();
  const latestPlat=finPlatAgg(latestPer);
  const allPlat=finPlatAgg(null);
  const topInc=latestPlat[0];
  const topRoi=allPlat.filter(d=>d.roi!=null).sort((a,b)=>b.roi-a.roi)[0];

  const kpi=[
    ['累计营业收入',fmoney(rev),'c-blue','会计口径（已扣退款）'],
    ['累计净利润（营销口径）',fmoney(net),net<0?'c-red':'c-blue','仅扣推广费/退款；货款·工资·税费待凭证入账'],
    ['累计净利率',fpct(margin),margin>=0?'c-green':'c-red','净利润 ÷ 营业收入'],
    ['累计推广费',fmoney(promoAll),'c-red','占收入 '+fpct(promoRate)],
    [finPeriodLabel(latest.period)+'净利润',fmoney(latest.net),latest.net<0?'c-red':'c-blue',prev?('环比 '+finDelta(latest.net,prev.net).replace(/<[^>]+>/g,'')):'首月'],
    ['试算平衡',balanced?'✅ 平衡':'❌ 不平衡',balanced?'c-green':'c-red',is.length+' 个会计期间 · 借贷各 '+fnum(dTot)]
  ];
  let h='<div class="dkpis">'+kpi.map(([n,v,cls,desc])=>
    `<div class="dkpi"><div class="k">${n}</div><div class="v ${cls}">${v}</div><div class="kpi-desc" style="margin-top:4px">${desc}</div></div>`).join('')+'</div>';

  h+='<div class="duo-grid">'
    +'<div class="card"><div class="bar-title">营收与净利润趋势 <span class="sub">月度 · 会计口径</span></div><div class="chart-box" id="finTrend"></div></div>'
    +'<div class="card"><div class="bar-title">平台收入占比 <span class="sub">全期累计 · 会计收入</span></div><div class="donut-wrap" id="finDonut"></div></div>'
    +'</div>';

  h+='<div class="card"><div class="bar-title">各平台投放效率 <span class="sub">柱：会计收入 / 推广费 · 橙线：ROI（收入÷推广费）</span></div><div class="chart-box" id="finPlatChart"></div></div>';

  /* 自动洞察 */
  const ins=[];
  ins.push(`📈 累计营业收入 <b>${fmoney(rev)}</b>，累计净利润 <b>${fmoney(net)}</b>，净利率 <b>${fpct(margin)}</b>；推广费占收入 <b>${fpct(promoRate)}</b>。`);
  if(prev){
    ins.push(`🗓️ ${finPeriodLabel(latest.period)}营业收入 ${fmoney(latest.rev)}，环比 ${finDelta(latest.rev,prev.rev)}；净利润 ${fmoney(latest.net)}，环比 ${finDelta(latest.net,prev.net)}。`);
  }
  if(topInc)ins.push(`🏆 ${finPeriodLabel(latestPer)}收入最高平台：<b>${esc(topInc.plat)}</b> ${fmoney(topInc.income)}，占当月 ${fpct(latestPer?topInc.income/latestPlat.reduce((a,d)=>a+d.income,0)*100:0)}。`);
  if(topRoi)ins.push(`🎯 全期投放 ROI 最高：<b>${esc(topRoi.plat)}</b>（ROI ${topRoi.roi.toFixed(2)}）；全期平均 ROI ${promoAll>0?(rev/promoAll).toFixed(2):'—'}。`);
  ins.push(`🔄 运营口径参考：累计 GMV ${fmoney(ops.gmv)}，退款率 <b>${fpct(ops.refundRate)}</b>，运营净收入（GMV−退款−推广费）${fmoney(ops.net)}。`);
  ins.push(`⚖️ 试算平衡：借方发生 ${fmoney(dTot)}，贷方发生 ${fmoney(cTot)}，${balanced?'<span class="roi-up">✅ 借贷平衡</span>':'<span class="roi-down">❌ 不平衡，请检查凭证</span>'}。`);
  ins.push(`⚠️ 当前仅收入/退款/推广费自动入账，<b>主营业务成本、管理费用、税金尚未录入</b>，净利润为营销口径、偏高；补录手工凭证后报表自动完整。`);
  h+='<div class="card"><div class="bar-title">财务洞察 <span class="sub">自动生成</span></div>'
    +'<ul style="margin:0;padding-left:18px;line-height:2;font-size:13px">'+ins.map(s=>`<li>${s}</li>`).join('')+'</ul></div>';

  /* ---------- 利润瀑布图（财务全景增强） ---------- */
  /* 收入 → 减退款 → 减销售费用(推广) → 减管理费用 → 减财务费用 → 营业利润 → 加营业外 → 净利润 */
  const nonOpIncome=is.reduce((a,r)=>a+(r.nonOpIn||0),0);
  const nonOpExp=is.reduce((a,r)=>a+(r.nonOpExp||0),0);
  const totalCost=is.reduce((a,r)=>a+(r.cost||0),0);
  const totalSelling=is.reduce((a,r)=>a+(r.selling||0),0);
  const totalAdmin=is.reduce((a,r)=>a+(r.admin||0),0);
  const totalFinance=is.reduce((a,r)=>a+(r.finance||0),0);
  const totalTax=is.reduce((a,r)=>a+(r.tax||0),0);
  /* 瀑布：以收入为起点，逐项扣减，加上营业外，得出净利润 */
  /* 当前快照主要字段：rev、refund（from ops）、selling、admin、finance、cost、tax、nonOpIn、nonOpExp、net */
  /* 退款从 ops 拿（marketing 口径）*/
  const totalRefund=ops.refund||0;
  const waterfallSegs=[
    {n:'营业收入',v:rev,kind:'total'},
    {n:'减：退款',v:-totalRefund,kind:'neg'},
    {n:'减：销售',v:-totalSelling,kind:'neg'},
    {n:'减：管理',v:-totalAdmin,kind:'neg'},
    {n:'减：财务',v:-totalFinance,kind:'neg'},
    {n:'减：主营成本',v:-totalCost,kind:'neg'},
    {n:'减：税金',v:-totalTax,kind:'neg'},
    {n:'加：营业外',v:nonOpIncome-nonOpExp,kind:'pos'},
    {n:'净利润',v:net,kind:'total'}
  ];
  /* 计算每段的累计位置（瀑布） */
  let running=0;
  const waterfallRender=waterfallSegs.map((s,i)=>{
    let cumStart,cumEnd;
    if(i===0){cumStart=0;cumEnd=s.v;}
    else if(s.kind==='total'){cumStart=0;cumEnd=s.v;}
    else{cumStart=running;cumEnd=running+s.v;}
    running=cumEnd;
    return {...s,cumStart,cumEnd};
  });
  const maxAbs=Math.max(...waterfallRender.flatMap(s=>[Math.abs(s.cumStart),Math.abs(s.cumEnd),Math.abs(s.v)]),1);
  const wfHtml=`<div class="card">
    <div class="bar-title">📊 利润瀑布图 <span class="sub">收入 → 各项扣减 → 净利润</span>
      <span style="margin-left:auto"><span class="est-tag">部分估算</span></span></div>
    <div class="waterfall">${waterfallRender.map(s=>{
      const baseY=Math.max(0,Math.min(s.cumStart,s.cumEnd));
      const height=Math.abs(s.cumEnd-s.cumStart);
      const isZero=height<1;
      const h=Math.max(2,(Math.abs(s.v)/maxAbs)*180);
      const color=s.kind==='total'?'#3370ff':s.kind==='neg'?'#f54a45':'#1e9e62';
      const displayV=s.kind==='total'?fmoney(s.v):(s.v>=0?'+':'')+fmoney(s.v);
      return `<div class="wf-col ${s.kind==='total'?'wf-total':''}">
        <div class="wf-val">${displayV}</div>
        <div class="wf-bar" style="height:${isZero?h:Math.max(2,height/maxAbs*180).toFixed(1)}px;background:${color};${!isZero?'margin-top:'+(180-Math.max(2,height/maxAbs*180)).toFixed(1)+'px':''}"></div>
        <div class="wf-lbl">${esc(s.n)}</div>
      </div>`;
    }).join('')}</div>
    <div class="hint">瀑布图展示从收入到净利润的逐项转化。绿色=加项（收入/营业外），红色=减项（退款/费用），蓝色=合计节点。当前主营成本/管理费用等列尚未入账，瀑布主要呈现营销口径的成本结构。</div>
  </div>`;

  /* ---------- 费用堆叠面积图（按月） ---------- */
  /* 取最近 6 个月的费用结构：销售(推广) / 管理 / 财务 / 主营成本 / 税金 */
  const last6=is.slice(-6);
  const areaLabels=last6.map(m=>finMShort(m.period));
  const areaSeries=[
    {n:'销售费用(推广)',color:'#f54a45',values:last6.map(m=>m.selling||0)},
    {n:'主营成本',color:'#ff8800',values:last6.map(m=>m.cost||0)},
    {n:'管理费用',color:'#7c5cd6',values:last6.map(m=>m.admin||0)},
    {n:'财务费用',color:'#22a06b',values:last6.map(m=>m.finance||0)},
    {n:'税金',color:'#4f6ef7',values:last6.map(m=>m.tax||0)}
  ];
  const areaHtml=last6.length>=2?`<div class="card">
    <div class="bar-title">📈 费用堆叠面积图 <span class="sub">近 ${last6.length} 个月 · 各费用项占比结构</span>
      <span style="margin-left:auto"><span class="est-tag">部分估算</span></span></div>
    <div class="area-legend">${areaSeries.filter(s=>s.values.some(v=>v>0)).map(s=>`<span class="li"><span class="dot" style="background:${s.color}"></span>${esc(s.n)}</span>`).join('')}</div>
    <div class="chart-box" id="finAreaChart" style="height:240px"></div>
    <div class="hint">每条彩色区域=该类费用在每月发生额。堆叠高度=当月总费用。空白段表示尚未录入对应凭证。</div>
  </div>`:'';

  /* ---------- 财务比率趋势 ---------- */
  const ratios=is.map((m,i)=>{
    const prev=is[i-1]||null;
    const opMargin=m.rev>0?m.opProfit/m.rev*100:0;
    const netMargin=m.rev>0?m.net/m.rev*100:0;
    const costRatio=m.rev>0?m.cost/m.rev*100:0;
    const expenseRatio=m.rev>0?((m.selling||0)+(m.admin||0)+(m.finance||0))/m.rev*100:0;
    return {period:m.period,opMargin,netMargin,costRatio,expenseRatio};
  });
  const lastRat=ratios[ratios.length-1];
  const prevRat=ratios[ratios.length-2]||null;
  const trendBars=(vals,max)=>vals.map(v=>`<div class="b" style="height:${Math.max(2,(v/max)*30).toFixed(1)}px"></div>`).join('');
  const ratioHtml=ratios.length?`<div class="card">
    <div class="bar-title">📊 财务比率趋势 <span class="sub">营业利润率 / 净利率 / 成本率 / 费用率</span>
      <span style="margin-left:auto"><span class="est-tag">估算</span></span></div>
    <div class="ratio-grid">
      <div class="ratio-card"><div class="rn">营业利润率</div><div class="rv" style="color:${lastRat.opMargin>=20?'#1e9e62':lastRat.opMargin>=10?'#3370ff':'#f54a45'}">${lastRat.opMargin.toFixed(1)}%</div><div class="mini-line">${trendBars(ratios.map(r=>r.opMargin),Math.max(...ratios.map(r=>r.opMargin),1))}</div></div>
      <div class="ratio-card"><div class="rn">净利润率</div><div class="rv" style="color:${lastRat.netMargin>=15?'#1e9e62':lastRat.netMargin>=5?'#3370ff':'#f54a45'}">${lastRat.netMargin.toFixed(1)}%</div><div class="mini-line">${trendBars(ratios.map(r=>r.netMargin),Math.max(...ratios.map(r=>r.netMargin),1))}</div></div>
      <div class="ratio-card"><div class="rn">主营成本率</div><div class="rv" style="color:${lastRat.costRatio<=30?'#1e9e62':lastRat.costRatio<=60?'#3370ff':'#f54a45'}">${lastRat.costRatio.toFixed(1)}%</div><div class="mini-line">${trendBars(ratios.map(r=>r.costRatio),Math.max(...ratios.map(r=>r.costRatio),1))}</div></div>
      <div class="ratio-card"><div class="rn">期间费用率</div><div class="rv" style="color:${lastRat.expenseRatio<=20?'#1e9e62':lastRat.expenseRatio<=40?'#3370ff':'#f54a45'}">${lastRat.expenseRatio.toFixed(1)}%</div><div class="mini-line">${trendBars(ratios.map(r=>r.expenseRatio),Math.max(...ratios.map(r=>r.expenseRatio),1))}</div></div>
      <div class="ratio-card"><div class="rn">营业利润率环比</div><div class="rv" style="color:${prevRat?(lastRat.opMargin-prevRat.opMargin>=0?'#1e9e62':'#f54a45'):'var(--ink3)'}">${prevRat?(lastRat.opMargin-prevRat.opMargin>=0?'+':'')+(lastRat.opMargin-prevRat.opMargin).toFixed(2)+'pp':'—'}</div><div class="rs">vs ${prevRat?finMShort(prevRat.period):'上期'}</div></div>
      <div class="ratio-card"><div class="rn">净利率环比</div><div class="rv" style="color:${prevRat?(lastRat.netMargin-prevRat.netMargin>=0?'#1e9e62':'#f54a45'):'var(--ink3)'}">${prevRat?(lastRat.netMargin-prevRat.netMargin>=0?'+':'')+(lastRat.netMargin-prevRat.netMargin).toFixed(2)+'pp':'—'}</div><div class="rs">vs ${prevRat?finMShort(prevRat.period):'上期'}</div></div>
    </div>
  </div>`:'';

  h+=wfHtml+areaHtml+ratioHtml;
  return h;
}

/* ---------- 仪表盘（飞书风格） ---------- */
const CH_BASES=['收入','推广支出','退款','净收入','销量'];
function channelsOf(){return ['淘宝','抖音','拼多多','小红书','tiktok'].filter(ch=>state.columns.includes(ch+'收入'));}
const TOT_COL={'收入':'总收入','推广支出':'总推广支出','退款':'总退款','净收入':'净收入','销量':'总销量'};
function platCol(plat,base){return plat==='全部'?TOT_COL[base]:plat+base;}
function sumCol(rows,col){return rows.reduce((a,r)=>a+((r.values&&r.values[col])||0),0);}
function dashRows(){
  if(dashTime==='all'||!state.rows.length)return state.rows;
  const last=state.rows[state.rows.length-1].date;let f;
  if(dashTime==='today')f=r=>r.date===last;
  else if(dashTime==='week'){const k=weekKeyOf(last);f=r=>weekKeyOf(r.date)===k;}
  else if(dashTime==='month'){const k=last.slice(0,7);f=r=>r.date.slice(0,7)===k;}
  else{const k=last.slice(0,4);f=r=>r.date.slice(0,4)===k;}
  return state.rows.filter(f);
}
/* 上期区间（用于同比/环比）—— 'all' 模式返回 null */
function prevDashRows(){
  if(dashTime==='all'||!state.rows.length)return null;
  const last=state.rows[state.rows.length-1].date;let f;
  if(dashTime==='today'){const prev=addDays(last,-1);f=r=>r.date===prev;}
  else if(dashTime==='week'){const k=prevWeekKey(weekKeyOf(last));f=r=>weekKeyOf(r.date)===k;}
  else if(dashTime==='month'){const k=prevMonthKey(last.slice(0,7));f=r=>r.date.slice(0,7)===k;}
  else{const k=(+last.slice(0,4)-1).toString();f=r=>r.date.slice(0,4)===k;}
  return state.rows.filter(f);
}
function prevWeekKey(k){const[y,w]=k.split('-W').map(Number);return w===1?`${y-1}-W52`:`${y}-W${String(w-1).padStart(2,'0')}`;}
function prevMonthKey(k){const[y,m]=k.split('-').map(Number);return m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`;}
/* 同比标签 HTML（cur/prev 同色按 invert 决定好坏方向）*/
function deltaChip(cur,prev,invert,fmt){
  if(cur==null||prev==null||isNaN(cur)||isNaN(prev))return '<span class="chip chip-null">—</span>';
  if(prev===0)return '<span class="chip chip-null">新数据</span>';
  const d=(cur-prev)/Math.abs(prev)*100;
  const upGood=!invert;
  const good=(d>=0)===upGood;
  const arrow=d>0?'↗':d<0?'↘':'·';
  const cls=good?'chip chip-up':'chip chip-down';
  const f=fmt||(v=>Math.abs(v).toFixed(1)+'%');
  return `<span class="${cls}">${arrow} ${f(d)}</span>`;
}
const DASH_TIME_LABEL={today:'今日',week:'本周',month:'本月',year:'本年',all:'全部'};
function platStats(){
  const rows=dashRows(),chs=channelsOf();
  const list=(dashPlatform==='全部'?chs:[dashPlatform]).map(ch=>{
    const gmv=sumCol(rows,ch+'收入'),spend=sumCol(rows,ch+'推广支出'),
      refund=sumCol(rows,ch+'退款'),profit=sumCol(rows,ch+'净收入'),qty=sumCol(rows,ch+'销量');
    return {plat:ch,gmv,spend,refund,profit,qty,roi:gmv>0&&spend>0?gmv/spend:null};
  }).filter(d=>d.gmv>0||d.spend>0||d.qty>0);
  list.sort((a,b)=>b.gmv-a.gmv);
  const tot={
    gmv:sumCol(rows,dashPlatform==='全部'?'总收入':dashPlatform+'收入'),
    spend:sumCol(rows,dashPlatform==='全部'?'总推广支出':dashPlatform+'推广支出'),
    expense:sumCol(rows,dashPlatform==='全部'?'总支出':dashPlatform+'推广支出')+(dashPlatform==='全部'?0:sumCol(rows,dashPlatform+'退款')),
    refund:sumCol(rows,dashPlatform==='全部'?'总退款':dashPlatform+'退款'),
    profit:sumCol(rows,dashPlatform==='全部'?'净收入':dashPlatform+'净收入'),
    qty:sumCol(rows,dashPlatform==='全部'?'总销量':dashPlatform+'销量')
  };
  tot.roi=tot.spend>0&&tot.gmv>0?tot.gmv/tot.spend:null;
  return {list,tot};
}
function dashRangeLabel(){
  const rows=dashRows();
  if(!rows.length)return '无数据';
  if(dashTime==='today')return rows[0].date;
  if(rows.length===1)return rows[0].date;

}
function renderDashboard(c){
  const chs=channelsOf();
  if(!state.rows.length||!chs.length){
    c.innerHTML='<div class="card"><div class="empty"><div class="big">📭</div><p>暂无渠道数据，先导入数据</p><button class="btn primary" onclick="switchView(\'data\')">前往数据管理</button></div></div>';
    return;
  }
  const curRows=dashRows();
  const prevRows=prevDashRows();
  const {list,tot}=platStats();
  const fmtCny=v=>'¥'+v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const fmtNum=v=>v.toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2});
  const prevTot=prevRows?{
    gmv:sumCol(prevRows,'总收入'),
    spend:sumCol(prevRows,'总推广支出'),
    expense:sumCol(prevRows,'总支出'),
    refund:sumCol(prevRows,'总退款'),
    profit:sumCol(prevRows,'净收入'),
    qty:sumCol(prevRows,'总销量')
  }:null;
  const prevAvgRoi=prevTot&&prevTot.spend>0&&prevTot.gmv>0?prevTot.gmv/prevTot.spend:null;
  // 真实 ROI
  const hasProd=prodItems().length>0;
  const rs=hasProd?periodRealStats(curRows):null;
  const prevRs=hasProd&&prevRows?periodRealStats(prevRows):null;
  // 综合毛利率
  const pm=prodMonths();
  // 单瓶物料 / 单瓶推广 (来自 prodMonths / products snapshot)
  const blendedU=hasProd?(function(){const items=prodItems();const totQty=items.reduce((a,p)=>a+(+p.est_monthly_qty||0),0);const totCost=items.reduce((a,p)=>a+(+p.unit_cost||0)*(+p.est_monthly_qty||0),0);return totQty>0?totCost/totQty:0;})():null;
  const promoPerUnit=hasProd&&pm?pm.promoPerUnitTotal:null;

  /* ---------- Hero 速览（月营收/月真实净利/现金流/库存周转）---------- */
  /* 月营收：本月（last 月）总 GMV —— 注意"是否整月"判断，处理部分月 */
  const lastMonth=state.rows.length?state.rows[state.rows.length-1].date.slice(0,7):null;
  const monthRows=lastMonth?state.rows.filter(r=>r.date.slice(0,7)===lastMonth):[];
  const monthDaysSoFar=monthRows.length;
  const monthDaysTotal=lastMonth?(function(){
    const [yr,mo]=lastMonth.split('-').map(Number);
    return new Date(yr,mo,0).getDate();
  })():30;
  const isPartialMonth=!!lastMonth&&monthDaysSoFar>0&&monthDaysSoFar<monthDaysTotal;
  const projFactor=isPartialMonth&&monthDaysSoFar>0?(monthDaysTotal/monthDaysSoFar):1;
  const monthLbl=isPartialMonth?(monthLabel(lastMonth)+'至今'):monthLabel(lastMonth);
  const monthGmv=monthRows.reduce((a,r)=>a+(+r.values['总收入']||0),0);
  const monthPromo=monthRows.reduce((a,r)=>a+(+r.values['总推广支出']||0),0);
  const monthRefund=monthRows.reduce((a,r)=>a+(+r.values['总退款']||0),0);
  const monthQty=monthRows.reduce((a,r)=>a+(+r.values['总销量']||0),0);
  /* 同期对比：上月同期（lastMonth 头 monthDaysSoFar 天），避免 5 天当 30 天比 */
  const prevMonth=lastMonth?prevMonthKey(lastMonth):null;
  const prevMonthSameRows=prevMonth?state.rows.filter(r=>r.date.slice(0,7)===prevMonth).slice(0,monthDaysSoFar):[];
  const prevMonthGmv=prevMonthSameRows.reduce((a,r)=>a+(+r.values['总收入']||0),0);
  const prevMonthQty=prevMonthSameRows.reduce((a,r)=>a+(+r.values['总销量']||0),0);
  /* 整月预估（按当前日均年化） */
  const monthProjectedGmv=isPartialMonth?+(monthGmv*projFactor).toFixed(2):monthGmv;
  const monthProjectedQty=isPartialMonth?Math.round(monthQty*projFactor):monthQty;
  /* 物料成本：完整月用 pm.monthlyCost；部分月按已过天数折算（更公平） */
  const monthMatCostFull=pm?(pm.monthlyCost||0):0;
  const monthMatCostPartial=isPartialMonth?+(monthMatCostFull/projFactor).toFixed(2):monthMatCostFull;
  const monthRealProfit=isPartialMonth?(monthGmv-monthMatCostPartial-monthPromo):(monthGmv-monthMatCostFull-monthPromo);
  const monthRealProfitProjected=isPartialMonth?+(monthProjectedGmv-monthMatCostFull-monthPromo*projFactor).toFixed(2):monthRealProfit;
  /* 现金流：净利回款口径 */
  const cashFlow=monthGmv-monthPromo-monthRefund;
  const cashFlowProjected=isPartialMonth?+(monthProjectedGmv-monthPromo*projFactor-monthRefund*projFactor).toFixed(2):cashFlow;
  /* 库存周转：当月销量 / 预估安全库存；部分月用"整月预估销量"换算 */
  const totalEstQty=prodItems().reduce((a,i)=>a+(+i.est_monthly_qty||0),0)||1;
  const curMonthSales=monthQty;
  const turnoverReal=totalEstQty>0?+(curMonthSales/totalEstQty*100).toFixed(1):null;
  const turnover=isPartialMonth&&totalEstQty>0?+(monthProjectedQty/totalEstQty*100).toFixed(1):turnoverReal;
  const turnoverLbl=turnover==null?'—':turnover>=80?'高':turnover>=40?'中':'低';

  const heroHtml=`<div class="hero-strip">

        <div class="h-v">${monthGmv>0?fmtCny(monthGmv):'—'}</div>
        <div class="h-sub">${esc(monthLbl)}${prevMonthGmv?' · <span style="color:'+(((monthGmv-prevMonthGmv)/prevMonthGmv*100)>=0?'#1e9e62':'#f54a45')+'">'+(((monthGmv-prevMonthGmv)/prevMonthGmv*100)>=0?'+':'')+((monthGmv-prevMonthGmv)/prevMonthGmv*100).toFixed(1)+'% vs 上月同期</span>':''}${isPartialMonth?'<br/>整月预估 <span style="font-weight:600">'+fmtCny(monthProjectedGmv)+'</span> <span class="est-tag">估算</span>':''}</div>
      </div>
      ${deltaChip(monthGmv,prevMonthGmv,false)}
    </div>
    <div class="hero">
      <div class="h-emoji">✨</div>
      <div class="h-body">
        <div class="h-k">真实净利${isPartialMonth?'<span class="est-tag" style="margin-left:4px">'+monthDaysSoFar+'天</span>':''}</div>
        <div class="h-v" style="color:${monthRealProfit>=0?'#1e9e62':'#f54a45'}">${fmtCny(monthRealProfit)}</div>
        <div class="h-sub">营收 ${fmtCny(monthGmv)}${isPartialMonth?'（按已过 '+monthDaysSoFar+' 天）':''} − 物料 ${fmtCny(isPartialMonth?monthMatCostPartial:monthMatCostFull)} − 推广 ${fmtCny(monthPromo)}${isPartialMonth?'<br/>整月预估 <span style="font-weight:600;color:'+(monthRealProfitProjected>=0?'#1e9e62':'#f54a45')+'">'+fmtCny(monthRealProfitProjected)+'</span> <span class="est-tag">估算</span>':''}</div>
      </div>
    </div>
    <div class="hero">
      <div class="h-emoji">💵</div>
      <div class="h-body">
        <div class="h-k">现金回款<span class="est-tag" style="margin-left:4px">估算</span></div>
        <div class="h-v">${cashFlow>0?fmtCny(cashFlow):'—'}</div>
        <div class="h-sub">GMV − 推广 − 退款${isPartialMonth?'（'+monthDaysSoFar+' 天）<br/>整月预估 <span style="font-weight:600">'+fmtCny(cashFlowProjected)+'</span> <span class="est-tag">估算</span>':''}</div>

      <div class="h-emoji">🔄</div>

        <div class="h-sub">${isPartialMonth?('已过 '+monthDaysSoFar+'/'+monthDaysTotal+' 天，整月预估销量 '+monthProjectedQty+' 瓶 ÷ 预估月销 '+Math.round(totalEstQty)+' 瓶 · '+turnoverLbl):('当月销量 '+monthQty+' 瓶 ÷ 预估月销 '+Math.round(totalEstQty)+' 瓶 · '+turnoverLbl)}${isPartialMonth?'<br/>同期同口径: 5 天实际周转 '+turnoverReal+'%（无年化）':''}</div>
      </div>
    </div>
  </div>`;

  /* ---------- 5 维健康度雷达 ---------- */
  /* 维度：营收增长 / 真实ROI / 退款控制 / 渠道集中度（反向） / 库存周转 */
  const radarDims=[];
  /* 营收增长：本月 vs 上月 */
  const revGrowth=prevMonthGmv?(monthGmv-prevMonthGmv)/prevMonthGmv*100:0;
  radarDims.push({n:'营收增长',v:revGrowth,score:Math.min(100,Math.max(0,50+revGrowth*2)),fmt:v=>(v>=0?'+':'')+v.toFixed(1)+'%',good:v=>v>=10});
  /* 真实 ROI */
  const realRoi=(rs&&rs.realRoi!=null)?rs.realRoi:null;
  radarDims.push({n:'真实ROI',v:realRoi==null?0:realRoi,score:realRoi==null?0:Math.min(100,realRoi*25),fmt:v=>realRoi==null?'未导入成本':v.toFixed(2),good:v=>v>=2});
  /* 退款控制 */
  const refundRate=tot.gmv>0?tot.refund/tot.gmv*100:0;
  radarDims.push({n:'退款控制',v:refundRate,score:Math.max(0,100-refundRate*4),fmt:v=>v.toFixed(1)+'%',good:v=>v<=10,invert:true});
  /* 渠道集中度（反向，分散度越高越好） */
  const totGmv=chs.reduce((a,ch)=>a+sumCol(curRows,ch+'收入'),0);
  const hhi=chs.reduce((a,ch)=>{const s=totGmv>0?sumCol(curRows,ch+'收入')/totGmv*100:0;return a+s*s;},0);
  const diversification=Math.max(0,100-hhi/30); // HHI 3000 → 0，HHI 1000 → 63.3
  radarDims.push({n:'渠道分散度',v:diversification,score:Math.round(diversification),fmt:v=>v.toFixed(0)+'分',good:v=>v>=60});
  /* 库存周转 */
  const turnoverScore=turnover!=null?Math.min(100,turnover*1.2):0;
  radarDims.push({n:'销售达成',v:turnover!=null?turnover:0,score:Math.round(turnoverScore),fmt:v=>v.toFixed(1)+'%',good:v=>v>=80});

  const overallHealth=Math.round(radarDims.reduce((a,d)=>a+d.score,0)/radarDims.length);
  const healthColor=overallHealth>=75?'#1e9e62':overallHealth>=55?'#3370ff':overallHealth>=35?'#ff8800':'#f54a45';
  const healthLbl=overallHealth>=75?'健康':overallHealth>=55?'稳健':overallHealth>=35?'关注':'预警';

  /* 雷达 SVG：5 边形 */
  const radarSize=280;

      return `<polygon points="${ring}" fill="none" stroke="#e6e9f2" stroke-width="1"/>`;

    ${radarDims.map((d,i)=>{

  const radarHtml=`<div class="card">
    <div class="bar-title">🩺 5 维健康度雷达 <span class="sub">营收·ROI·退款·渠道·周转</span>

  /* ---------- 12 个分组 KPI（4 组 × 3）---------- */
  /* 组 1：营收 · 组 2：成本 · 组 3：客户 · 组 4：经营 */
  const monthDays=curRows.length;

  const kpiGroup=(name,emoji,items)=>`<div class="card" style="padding:14px 16px">

  const kpiGroups=`<div class="kpi-groups"><div>${kpiGroup('营收','💰',[

    ])}</div><div>${kpiGroup('经营','⚙️',[
      {n:'真实 ROI',v:rs&&rs.realRoi!=null?rs.realRoi.toFixed(2):'—',c:rs&&rs.realRoi!=null?(rs.realRoi>=2?'#1e9e62':'#f54a45'):'var(--ink3)'},
      {n:'物料毛利率',v:pm&&pm.overallMarginRate!=null?pm.overallMarginRate.toFixed(1)+'%':'—',c:pm&&pm.overallMarginRate>=80?'#1e9e62':'#3370ff'},

  /* ---------- 智能经营洞察（自然语言） ---------- */
  const insights=[];
  /* partial month 专用：把"营收对比"明确为环比同期 (vs 上月同期)，避免跨窗口误判 */
  if(isPartialMonth){
    if(prevMonthGmv>0&&monthGmv>=prevMonthGmv){
      insights.push({lvl:'good',icon:'📈',t:`营收对比上月同期 <b>+${((monthGmv-prevMonthGmv)/prevMonthGmv*100).toFixed(1)}%</b>（${monthDaysSoFar}/${monthDaysTotal} 天对 ${monthDaysSoFar}/${prevMonth?new Date(+prevMonth.split('-')[0],+prevMonth.split('-')[1],0).getDate():30} 天，整月预估 <b>${fmtCny(monthProjectedGmv)}</b>）`});
    }else if(prevMonthGmv>0){
      insights.push({lvl:'warn',icon:'📉',t:`营收对比上月同期 <b>${((monthGmv-prevMonthGmv)/prevMonthGmv*100).toFixed(1)}%</b>（${monthDaysSoFar} 天同期比较，整月预估 <b>${fmtCny(monthProjectedGmv)}</b>）`});
    }else{
      insights.push({lvl:'warn',icon:'📊',t:`本月已过 <b>${monthDaysSoFar}/${monthDaysTotal}</b> 天，整月预估营收 <b>${fmtCny(monthProjectedGmv)}</b> <span class="est-tag">估算</span>`});
    }
  }else{
    if(revGrowth>=20)insights.push({lvl:'good',icon:'📈',t:`月营收同比增长 <b>+${revGrowth.toFixed(1)}%</b>，处于加速通道`});
    else if(revGrowth<=-10)insights.push({lvl:'danger',icon:'📉',t:`月营收同比 <b>${revGrowth.toFixed(1)}%</b> 负增长，建议排查原因（淡季？促销缺失？）`});
  }
  if(hhi>2500)insights.push({lvl:'warn',icon:'⚖️',t:`渠道集中度 <b>HHI ${hhi.toFixed(0)}</b> 偏高（>2500），建议拓展第二渠道降低单点风险`});
  if(turnover!=null&&turnover<40)insights.push({lvl:'warn',icon:'📦',t:`销售达成率 <b>${turnover}%</b> 偏低，当月销量未达预估月销，关注动销节奏`});
  /* 单瓶物料与单瓶推广对比 */
  if(blendedU&&promoPerUnit&&promoPerUnit>blendedU*4){

  /* 真实净利洞察（partial 月按"按已过天数换算物料"得出的是实际已发生数；亏损提醒要看整月预估） */
  if(!isPartialMonth&&monthRealProfit<0){

  }else if(!isPartialMonth&&monthRealProfit>0&&realRoi!=null&&realRoi<1){

  }else if(isPartialMonth&&monthRealProfitProjected<0){
    insights.push({lvl:'danger',icon:'💔',t:`整月预估真实净利 <b style="color:#f54a45">${fmtCny(monthRealProfitProjected)}</b>，按当前日均推算月底会亏损，需控费提量`});
  }else if(isPartialMonth&&monthRealProfitProjected>0){

  const insightsHtml=insights.length?`<div class="card">
    <div class="bar-title">💡 智能经营洞察 <span class="sub">${insights.length} 条建议</span></div>
    ${insights.map(i=>`<div class="insight ${i.lvl}"><span class="ii">${i.icon}</span><span class="ib">${i.t}</span></div>`).join('')}
  </div>`:'';

  /* ---------- 月度经营全景（创始人视角：近 12 个完整月） ---------- */
  const mGroups=(function(){
    const m=new Map();
    for(const r of state.rows){const k=r.date.slice(0,7);if(!m.has(k))m.set(k,[]);m.get(k).push(r);}
    return [...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1);

  /* 最新月若不完整则标注，全景图展示最近 12 个月 */
  const mAll=mGroups.map(([k,rs])=>{
    const gmv=rs.reduce((a,r)=>a+(+r.values['总收入']||0),0);
    const promo=rs.reduce((a,r)=>a+(+r.values['总推广支出']||0),0);
    const refund=rs.reduce((a,r)=>a+(+r.values['总退款']||0),0);
    const qty=rs.reduce((a,r)=>a+(+r.values['总销量']||0),0);
    return {k,gmv,promo,refund,qty,
      net:gmv-refund-promo,
      roi:promo>0?gmv/promo:null,

  const mLastKey=state.rows.length?state.rows[state.rows.length-1].date.slice(0,7):null;
  const mLastDays=mLastKey?(function(){const[yr,mo]=mLastKey.split('-').map(Number);return new Date(yr,mo,0).getDate();})():30;
  const mLastActual=mGroups.find(g=>g[0]===mLastKey)?mGroups.find(g=>g[0]===mLastKey)[1].length:0;
  const mLastPartial=mLastActual<mLastDays;
  const mView=mAll.slice(-12);
  const mLabels=mView.map(m=>(+m.k.split('-')[1])+'月');
  const monthlyHtml=mView.length>=2?`<div class="card">

    </tr></thead><tbody>
    ${mView.slice().reverse().map(m=>`<tr${m.k===mLastKey?' style="background:var(--accent-weak,#eef3fd);font-weight:600"':''}>
      <td>${m.k}${m.k===mLastKey&&mLastPartial?'（未整月）':''}</td>
      <td style="text-align:right;color:#3370ff">${fmtCny(m.gmv)}</td>
      <td style="text-align:right;color:#f54a45">${fmtCny(m.promo)}</td>
      <td style="text-align:right;color:#f54a45">${fmtCny(m.refund)}</td>

/* 各平台数据对比：GMV/支出 双柱 + ROI 折线（双轴） */
function renderPlatChart(el,data){
  if(!el)return;
  if(!data.length){el.innerHTML='<div class="empty" style="padding:40px">该时间范围内无平台数据</div>';return;}
  const W=620,H=290,pl=52,pr=52,pt=24,pb=34;
  const n=data.length;
  const maxL=Math.max(...data.map(d=>Math.max(d.gmv,d.spend)),1)*1.15;
  const rois=data.map(d=>d.roi).filter(v=>v!=null);
  const maxR=rois.length?Math.max(...rois)*1.25:10;
  const X=i=>pl+(W-pl-pr)*(i+0.5)/n;
  const YL=v=>pt+(H-pt-pb)*(1-v/maxL);
  const YR=v=>pt+(H-pt-pb)*(1-v/maxR);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let g=0;g<=4;g++){
    const lv=maxL*g/4,y=YL(lv);
    svg+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#eef1f6"/>`;
    svg+=`<text x="${pl-7}" y="${y+3.5}" text-anchor="end" font-size="10" fill="#9aa3b2">${(lv/1e4).toLocaleString('zh-CN',{maximumFractionDigits:0})}</text>`;
    const rv=maxR*g/4;
    svg+=`<text x="${W-pr+7}" y="${YL(rv)+3.5}" font-size="10" fill="#ff8800" opacity=".75">${rv.toLocaleString('zh-CN',{maximumFractionDigits:1})}</text>`;
  }
  svg+=`<text x="${pl-7}" y="${pt-9}" text-anchor="end" font-size="9.5" fill="#9aa3b2">万元</text>`;
  svg+=`<text x="${W-pr+7}" y="${pt-9}" font-size="9.5" fill="#ff8800" opacity=".75">ROI</text>`;
  const bw=Math.min(34,(W-pl-pr)/n*0.26);
  data.forEach((d,i)=>{
    const x=X(i);
    if(d.gmv>0){const y=YL(d.gmv);svg+=`<rect x="${x-bw-3}" y="${y}" width="${bw}" height="${H-pb-y}" rx="3" fill="#3370ff" opacity=".92"/>`;}
    if(d.spend>0){const y=YL(d.spend);svg+=`<rect x="${x+3}" y="${y}" width="${bw}" height="${H-pb-y}" rx="3" fill="#22c7c7" opacity=".92"/>`;}
    svg+=`<text x="${x}" y="${H-11}" text-anchor="middle" font-size="11" fill="#5b6472">${esc(d.plat)}</text>`;
  });
  let dPath='',started=false;const pts=[];
  data.forEach((d,i)=>{if(d.roi==null){started=false;return;}
    const x=X(i),y=YR(d.roi);pts.push([x,y,d.roi]);
    dPath+=(started?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';started=true;});
  if(dPath)svg+=`<path d="${dPath}" fill="none" stroke="#ff8800" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(([x,y,r])=>{
    svg+=`<circle cx="${x}" cy="${y}" r="3.4" fill="#fff" stroke="#ff8800" stroke-width="1.8"/>`;
    svg+=`<text x="${x}" y="${y-9}" text-anchor="middle" font-size="10.5" fill="#ff8800" font-weight="600">${r.toFixed(2)}</text>`;
  });
  svg+='</svg>';
  const wrap=document.createElement('div');wrap.innerHTML=svg;
  const overlay=document.createElement('div');
  overlay.style.cssText='position:absolute;inset:0;display:flex;';
  data.forEach(d=>{
    const hz=document.createElement('div');hz.style.cssText='flex:1;cursor:crosshair';
    hz.addEventListener('mousemove',e=>{
      const tt=tooltip();
      tt.innerHTML=`<div class="tt-t">${esc(d.plat)}</div>
        <div><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#3370ff;margin-right:5px"></span>GMV：¥${d.gmv.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#22c7c7;margin-right:5px"></span>支出：¥${d.spend.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff8800;margin-right:5px"></span>ROI：${d.roi!=null?d.roi.toFixed(2):'—'}</div>`;
      tt.style.display='block';
      tt.style.left=Math.min(e.clientX+14,window.innerWidth-tt.offsetWidth-10)+'px';
      tt.style.top=(e.clientY+14)+'px';
    });
    hz.addEventListener('mouseleave',()=>{tooltip().style.display='none';});
    overlay.appendChild(hz);
  });
  el.style.position='relative';
  el.appendChild(wrap);el.appendChild(overlay);
}
function chsColor(plat){const chs=channelsOf();return DONUT_COLORS[Math.max(0,chs.indexOf(plat))%DONUT_COLORS.length];}

  const S=170,R=64,SW=26,C=2*Math.PI*R;
  let off=0,segs='';
  data.forEach(d=>{
    const frac=d.gmv/total,len=Math.max(frac*C-1.5,0.9);   // 极小段保底 0.9px，防止负 dasharray 变整环
    segs+=`<circle cx="${S/2}" cy="${S/2}" r="${R}" fill="none" stroke="${chsColor(d.plat)}" stroke-width="${SW}"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 ${S/2} ${S/2})" stroke-linecap="butt"/>`;
    off+=frac*C;
  });
  const legend=data.map(d=>`<div class="li"><span class="dot" style="background:${chsColor(d.plat)}"></span>${esc(d.plat)}
    <span class="amt">¥${d.gmv.toLocaleString('zh-CN',{maximumFractionDigits:0})}</span><span class="pct">${(d.gmv/total*100).toFixed(2)}%</span></div>`).join('');
  el.innerHTML=`<div class="donut-box"><svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}">${segs}</svg>
    <div class="donut-center"><div class="dc1">${centerLabel||"总GMV"}</div><div class="dc2">¥${total.toLocaleString('zh-CN',{maximumFractionDigits:0})}</div></div></div>
    <div class="dlegend">${legend}</div>`;
}

function periodNavHtml(type,key){
  const list=periodsOf(type);
  if(!list.length)return '';
  if(!key||!list.includes(key))key=list[list.length-1];
  let sel='';
  if(type==='daily'){
    sel=`<input type="date" id="datePick" value="${key}" min="${list[0]}" max="${list[list.length-1]}">`;
  }else{
    const opts=list.map(k=>`<option value="${k}" ${k===key?'selected':''}>${periodTitle(type,k)}</option>`).join('');
    sel=`<select id="periodSel">${opts}</select>`;
  }
  return `<div class="period-nav no-print">
    <button class="pbtn" id="pPrev" ${prevKey(list,key)?'':'disabled style="opacity:.35"'}>‹</button>
    ${sel}
    <button class="pbtn" id="pNext" ${nextKey(list,key)?'':'disabled style="opacity:.35"'}>›</button>
    <button class="btn" id="pLatest">最新一期</button>
    <button class="btn" id="addDataBtn">➕ 录入今日数据</button>
    <div class="spacer"></div>
    <button class="btn primary" id="snapBtn">📥 存入归档</button>
    <button class="btn" id="printBtn">🖨️ 打印 / 导出 PDF</button>
  </div>`;
}

function renderReportView(c,snapshot){
  const type=snapshot?snapshot.type:curView;
  let rep;
  if(snapshot){rep=snapshot.rep;}
  else{
    const list=periodsOf(type);
    if(!list.length){c.innerHTML='<div class="card"><div class="empty"><div class="big">📭</div><p>还没有数据，先去「数据管理」导入或恢复演示数据</p><button class="btn primary" onclick="switchView(\'data\')">前往数据管理</button></div></div>';return;}
    if(!curPeriod||!list.includes(curPeriod))curPeriod=list[list.length-1];
    rep=buildReport(type,curPeriod);
  }
  if(!chartMetric||!state.columns.includes(chartMetric))chartMetric=state.columns[0]||null;

  let html= snapshot?
    `<div class="period-nav no-print"><button class="btn" id="backArc">← 返回归档列表</button>
     <div class="spacer"></div><span style="font-size:12px;color:var(--ink3)">归档于 ${snapshot.createdAt}</span>
     <button class="btn" id="printBtn">🖨️ 打印 / 导出 PDF</button></div>`:
    periodNavHtml(type,rep.key)+
    `<div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px;font-size:12.5px;color:var(--ink2)">
      <div class="period-tabs" style="display:flex;gap:2px">
        ${['daily','weekly','monthly','yearly'].map(t=>`<span onclick="switchView('${t}')" style="padding:4px 12px;border-radius:6px;font-size:13px;cursor:pointer;${t===type?'background:var(--accent-weak);color:var(--accent);font-weight:600':'color:var(--ink3)'}">${{daily:'日报',weekly:'周报',monthly:'月报',yearly:'年报'}[t]}</span>`).join('')}
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span>当前周期 <b style="color:var(--ink)">${esc(rep.title)}</b></span>
        <span style="color:var(--ink3)">·</span>
        <span>环比基准 <b style="color:var(--ink)">${esc(rep.prevTitle)}</b></span>
      </div>
    </div>`;

  const typeName={daily:'日报',weekly:'周报',monthly:'月报',yearly:'年报'}[type]||'报告';
  // 数据范围
  const sortedRows=[...state.rows].sort((a,b)=>a.date.localeCompare(b.date));
  const firstDay=sortedRows.length?sortedRows[0].date.slice(0,7).replace('-','-').slice(0,4)+'-'+sortedRows[0].date.slice(5,7):'';
  const lastDay=sortedRows.length?sortedRows[sortedRows.length-1].date.slice(0,7).replace('-','-').slice(0,4)+'-'+sortedRows[sortedRows.length-1].date.slice(5,7):'';
  const dataRange=(firstDay&&lastDay)?(firstDay===lastDay?firstDay:firstDay+' ~ '+lastDay):'—';
  const updatedAt=state.rows.length?sortedRows[sortedRows.length-1].date.replace(/-/g,'/'):'—';
  // 渠道列表
  const channels=Array.from(new Set(state.columns.filter(c=>!['总收入','总支出','净收入','总退款','总推广支出','总销量'].includes(c)).map(c=>c.replace(/(收入|退款|推广支出|净收入|销量)$/,'')))).filter(c=>c);
  const channelTxt=channels.length?channels.join(' / '):'—';
  const totalDays=state.rows.length;
  const totalMetrics=state.columns.length;

  // 页面标题区（飞书风格）
  html+=`<div style="margin:0 0 18px">
    <div style="font-size:24px;font-weight:700;letter-spacing:-.3px">时间法则营销数据总览</div>
    <div style="font-size:13px;color:var(--ink3);margin-top:6px;line-height:1.6">
      时间法则多周期营销数据看板：核心指标、渠道投放、趋势分析与 AI 洞察一站式查看</div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;background:#fff4e6;color:#c77c1a;font-size:12px;font-weight:600;border:1px solid #fde0b8">📋 真实数据快照</span>
      <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;background:#f4f6fb;color:var(--ink2);font-size:12px;border:1px solid var(--line)">${totalDays} 天</span>
      <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;background:#f4f6fb;color:var(--ink2);font-size:12px;border:1px solid var(--line)">${totalMetrics} 项指标</span>
    </div>
  </div>`;

  // 数据快照卡
  html+=`<div class="card" style="padding:16px 20px;margin-bottom:14px">
    <div style="font-size:13.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px">
      <span style="font-size:18px">📋</span>数据快照
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;font-size:12.5px;color:var(--ink2)">
      <div><span style="color:var(--ink3)">来源：</span>营销发展日报（应用数据库）</div>
      <div style="text-align:right"><span style="color:var(--ink3)">更新时间</span> <span style="font-weight:600;color:var(--ink)">${updatedAt}</span></div>
      <div><span style="color:var(--ink3)">覆盖周期</span> <span style="font-weight:600;color:var(--ink)">${dataRange}</span></div>
      <div style="text-align:right"><span style="color:var(--ink3)">覆盖渠道</span> <span style="font-weight:600;color:var(--ink)">${channelTxt}</span></div>
    </div>
  </div>`;

  // KPI 卡片（新布局：emoji+趋势右上→大数字→指标名→描述→上期）
  html+='<div class="kpi-grid">';
  for(const k of rep.kpis){
    const emoji=KPI_EMOJIS[k.col]||'📊';
    const desc=KPI_DESC[k.col]||'';
    let trendHtml='';
    if(k.delta!=null){
      const up=k.delta>0;
      const cls=Math.abs(k.delta)<0.5?'flat':(up?'up':'down');
      const arrow=Math.abs(k.delta)<0.5?'≈':(up?'↑':'↓');
      trendHtml=`<span class="kpi-trend ${cls}">${arrow} ${Math.abs(k.delta).toFixed(1)}%</span>`;
    }
    let cmpHtml='';
    if(k.prev!=null){
      cmpHtml=`<div class="cmp">上期 ${fmtVal(k.prev,k.fmt)}</div>`;
    }
    html+=`<div class="kpi">
      <div class="kpi-header">
        <span class="kpi-emoji">${emoji}</span>
        ${trendHtml}
      </div>
      <div class="val">${k.cur==null?'—':fmtVal(k.cur,k.fmt)}</div>
      <div class="kpi-name">${esc(k.name)}</div>
      <div class="kpi-desc">${esc(desc)}</div>
      ${cmpHtml}
    </div>`;
  }
  // 日报附加卡：本周/本月累计（累计至所选日，环比上期同期）
  if(type==='daily'&&!snapshot){
    const mk=rep.key.slice(0,7), day=+rep.key.slice(8,10);
    const y=+mk.slice(0,4), m=+mk.slice(5,7);
    const pm=m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`;
    const prevMonthEnd=pm+'-'+String(Math.min(day,new Date(y,m-1,0).getDate())).padStart(2,'0');
    const dow=(new Date(rep.key+'T00:00:00').getDay()+6)%7;           // 周一=0
    const addDays=(ds,n)=>{const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return d2s(d);};
    const ws=addDays(rep.key,-dow);                                    // 本周一
    const accum=(col,from,to,prevFrom,prevTo)=>({
      cur:aggRows(state.rows.filter(r=>r.date>=from&&r.date<=to),col),
      prev:aggRows(state.rows.filter(r=>r.date>=prevFrom&&r.date<=prevTo),col)});
    const accumCard=(label,sub,col,cur,prev,invert,noPrevTxt)=>{
      let trendHtml='', cmpHtml='';
      if(cur!=null&&prev!=null&&prev!==0){
        const dd=(cur-prev)/Math.abs(prev)*100, up=dd>0;
        const cls=Math.abs(dd)<0.5?'flat':(up?'up':'down');
        const arrow=Math.abs(dd)<0.5?'≈':(up?'↑':'↓');
        trendHtml=`<span class="kpi-trend ${cls}">${arrow} ${Math.abs(dd).toFixed(1)}%</span>`;
        cmpHtml=`<div class="cmp">上期同期 ${fmtVal(prev,'cny')}</div>`;
      }else if(cur!=null&&prev==null){cmpHtml=`<div class="cmp">— ${noPrevTxt}</div>`;}
      else if(cur!=null){cmpHtml=`<div class="cmp">— ${noPrevTxt}</div>`;}
      return `<div class="kpi">
        <div class="kpi-header"><span class="kpi-emoji">📊</span>${trendHtml}</div>
        <div class="val">${cur==null?'—':fmtVal(cur,'cny')}</div>
        <div class="kpi-name">${esc(label)}</div>
        <div class="kpi-desc">${esc(sub||'')}</div>
        ${cmpHtml}
      </div>`;
    };
    if(state.columns.includes('净收入')){
      const wk=accum('净收入',ws,rep.key,addDays(ws,-7),addDays(rep.key,-7));
      const mo=accum('净收入',mk+'-01',rep.key,pm+'-01',prevMonthEnd);
      html+=accumCard('本周净利','本周累计净利润','净收入',wk.cur,wk.prev,false,'上周同期无数据');
      html+=accumCard('本月净利','本月累计净利润','净收入',mo.cur,mo.prev,false,'上月同期无数据');
    }
    if(state.columns.includes('总收入')){
      const mo=accum('总收入',mk+'-01',rep.key,pm+'-01',prevMonthEnd);
      html+=accumCard('本月GMV','本月累计成交总额','总收入',mo.cur,mo.prev,false,'上月同期无数据');
    }
    if(state.columns.includes('总支出')){
      const mo=accum('总支出',mk+'-01',rep.key,pm+'-01',prevMonthEnd);
      html+=accumCard('本月总消耗','推广+退款','总支出',mo.cur,mo.prev,true,'上月同期无数据');
    }
    if(state.columns.includes('总推广支出')){
      const mo=accum('总推广支出',mk+'-01',rep.key,pm+'-01',prevMonthEnd);
      html+=accumCard('本月推广消耗','各平台广告投放，本月累计','总推广支出',mo.cur,mo.prev,true,'上月同期无数据');
    }
  }
  // 日报：本月目标进度卡（紧凑版，已设目标时显示）
  if(type==='daily'&&!snapshot){
    const tmon=rep.key.slice(0,7);
    if(state.targets[tmon]&&Object.keys(state.targets[tmon]).length){
      let pb='';
      for(const metric of Object.keys(state.targets[tmon])){
        if(!state.columns.includes(metric))continue;
        const p=monthProgress(tmon,metric);if(!p)continue;
        const cfg=state.config[metric]||{name:metric};
        const pct=p.target?Math.min(100,p.pace*100):0;
        const good=p.status==='领先'||p.status==='达成';
        const col=!p.target?'#c9d1e3':(good?'#1e9e62':p.status==='持平'?'#c77c1a':'#d5384a');
        pb+=`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>${esc(dispName(metric))} 目标 ${fmtVal(p.target,'cny')}</span><span style="color:var(--ink2)">${pct.toFixed(0)}% · 预测 <b style="color:${col}">${fmtVal(p.forecast,'cny')}</b> <span style="color:${col};font-weight:600">${p.status}</span></span></div><div style="height:8px;background:#eef1f6;border-radius:5px;overflow:hidden"><div style="width:${pct.toFixed(1)}%;height:100%;background:${col};transition:width .5s"></div></div></div>`;
      }
      if(pb)html+=`<div class="kpi" style="grid-column:1/-1;background:linear-gradient(135deg,var(--card),rgba(79,110,247,.05))"><div class="kpi-name">🎯 月度目标进度 <span style="font-size:11px;color:var(--ink3)">${monthLabel(tmon)}</span> <span class="sub" style="margin-left:4px">月报页可设/改目标</span></div><div style="margin-top:8px">${pb}</div></div>`;
    }
  }
  html+='</div>';

  // 月报：目标达成 & 月度预测卡
  if(type==='monthly'&&!snapshot){html+=targetCardHtml(rep.key);}

  // 图表
  const metricOpts=state.columns.map(col=>{
    const nm=dispName(col);
    return `<option value="${esc(col)}" ${col===chartMetric?'selected':''}>${esc(nm)}</option>`;}).join('');
  html+=`<div class="card">
    <h3>趋势 <span class="sub">近 ${rep.chartLabels.length} 期</span>
      <div class="right no-print"><select id="chartMetricSel" style="border:1px solid var(--line);border-radius:8px;height:28px;padding:0 8px;font-size:12.5px;font-family:inherit">${metricOpts}</select></div>
    </h3>
    <div class="chart-box" id="chartBox"></div>
    <div id="chartLegend" style="margin-top:10px;font-size:12px;color:var(--ink2);display:flex;gap:18px;flex-wrap:wrap"></div>
  </div>`;

  // 明细表
  const detailTitle=type==='daily'?'数据明细·近30天日度明细':'明细';
  const detailSub=type==='daily'?`当前周期：${esc(rep.key)} · 默认按时间降序 · 点击列名排序`:`近 ${rep.tableRows.length} 期（环比上期）`;
  html+=`<div class="card"><h3>${esc(detailTitle)} <span class="sub">${detailSub}</span></h3><div style="overflow-x:auto"><table class="rt"><thead><tr><th>期间</th>`;
  for(const k of rep.kpis)html+=`<th>${esc(k.name)}</th>`;
  html+='</tr></thead><tbody>';
  for(const row of rep.tableRows){
    html+=`<tr class="${row.key===rep.key?'cur':''}"><td>${esc(row.label)}</td>`;
    const ri=rep.tableRows.indexOf(row);
    const prevRow=(rep.tableAsc&&String(row.key).length===4)?null:rep.tableRows[ri+(rep.tableAsc?-1:1)];
    row.vals.forEach((v,i)=>{
      let d='';
      if(prevRow){const pv=prevRow.vals[i];
        if(v!=null&&pv!=null&&pv!==0){const dd=(v-pv)/Math.abs(pv)*100;
          if(Math.abs(dd)>=0.05){const up=dd>0;const good=rep.kpis[i].invert?!up:up;
            d=`<br><span class="${good?'d-up':'d-down'}" style="font-size:11px">${up?'▲':'▼'}${Math.abs(dd).toFixed(1)}%</span>`;}}}
      html+=`<td>${v==null?'—':fmtVal(v,rep.kpis[i].fmt)}${d}</td>`;
    });
    html+='</tr>';
  }
  html+='</tbody></table></div></div>';

  // 同比环比矩阵：核心指标横评总表
  html+=`<div class="card"><h3>同比环比矩阵</h3><div style="font-size:12.5px;color:var(--ink3);margin:-8px 0 14px">核心指标横评 · 涨红跌绿 · 环比基准：${esc(rep.prevTitle)}</div><div style="overflow-x:auto"><table class="rt matrix"><thead><tr><th>指标</th><th style="text-align:right">本期</th><th style="text-align:right">上期</th><th style="text-align:right">环比</th><th>评估</th></tr></thead><tbody>`;
  for(const k of rep.kpis){
    let dc='<span class="d-flat">—</span>',stxt='—',scls='d-flat';
    if(k.delta!=null){
      const up=k.delta>0,good=k.invert?!up:up;
      const cls=k.invert?(up?'d-down':'d-up'):(up?'d-up':'d-down');
      dc=`<span class="${cls}">${up?'↗':'↘'} ${Math.abs(k.delta).toFixed(1)}%</span>`;
      const ad=Math.abs(k.delta);
      if(ad<5){stxt='平稳';scls='flat';}
      else if(good){stxt='表现良好';scls='good';}
      else{stxt='需关注';scls='warn';}
    }else if(k.cur!=null){stxt='首期';scls='flat';}
    html+=`<tr><td style="font-weight:600">${esc(k.name)}</td><td style="text-align:right;font-weight:600">${k.cur==null?'—':fmtVal(k.cur,k.fmt)}</td><td style="text-align:right;color:var(--ink3)">${k.prev==null?'—':fmtVal(k.prev,k.fmt)}</td><td style="text-align:right">${dc}</td><td><span class="eval-badge ${scls}">${stxt}</span></td></tr>`;
  }
  html+=`</tbody></table></div><div style="margin-top:10px;padding:8px 10px;background:#f8f9fc;border-radius:6px;font-size:11.5px;color:var(--ink3);line-height:1.7">口径说明：涨红跌绿（中国习惯）——收益类指标上涨为红、下跌为绿；消耗类指标（总消耗 / 推广消耗 / 退款）方向反转。总消耗口径 = 推广消耗 + 退款金额；2026-07 起部分日期录入值与公式存在差异，当前按原始数据展示。</div></div>`;

  // 数据洞察
  html+=`<div class="card"><h3>数据洞察 <span class="sub">自动分析</span></h3><div class="summary">${rep.summary||'—'}</div></div>`;

  c.innerHTML=html;
  c.querySelectorAll('[data-pt]').forEach(el=>el.onclick=()=>switchView(el.dataset.pt));

  // 绑定事件
  if(snapshot){
    $('#backArc').onclick=()=>{curView='archive';render();};
  }else{
    const list=periodsOf(type);
    $('#pPrev').onclick=()=>{const p=prevKey(list,rep.key);if(p){curPeriod=p;render();}};
    $('#pNext').onclick=()=>{const nx=nextKey(list,rep.key);if(nx){curPeriod=nx;render();}};
    $('#pLatest').onclick=()=>{curPeriod=list[list.length-1];render();};
    $('#addDataBtn').onclick=()=>switchView('data');
    const dp=$('#datePick');if(dp)dp.onchange=()=>{if(dp.value&&list.includes(dp.value)){curPeriod=dp.value;render();}};
    const ps=$('#periodSel');if(ps)ps.onchange=()=>{curPeriod=ps.value;render();};
    $('#snapBtn').onclick=()=>{addSnapshot(rep);};
  }
  $('#printBtn').onclick=()=>window.print();
  const cms=$('#chartMetricSel');
  if(cms)cms.onchange=()=>{chartMetric=cms.value;drawChart(rep);};
  const stb=$('#saveTargetBtn');
  if(stb)stb.onclick=()=>{
    if(!state.targets)state.targets={};
    const obj=state.targets[rep.key]||{};
    c.querySelectorAll('[data-tgt-metric]').forEach(inp=>{
      const metric=inp.dataset.tgtMetric;const v=parseNum(inp.value);
      if(v!=null&&v>0)obj[metric]=v;else delete obj[metric];});
    state.targets[rep.key]=obj;saveState();toast('目标已保存');render();
  };

  drawChart(rep);
}

function drawChart(rep){
  const box=$('#chartBox');if(!box)return;
  const metric=chartMetric||state.columns[0];
  const kpi=rep.kpis.find(k=>k.col===metric)||{fmt:'int',color:COLORS[0],name:metric};
  const series=[{name:kpi.name,values:rep.chartData[metric]||[],color:kpi.color,mode:rep.type==='daily'?'line':'bar'}];
  const legend=[`<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${kpi.color};margin-right:6px"></span>${esc(kpi.name)}</span>`];
  if(rep.type==='daily'){
    const ma=movingAvg(rep.chartData[metric]||[],7);
    series.push({name:'7 期移动平均',values:ma,color:'#e8790a',mode:'line',dashed:true});
    legend.push(`<span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed #e8790a;margin-right:6px;vertical-align:middle"></span>7 期移动平均</span>`);
  }
  renderChart(box,rep.chartLabels,series,kpi.fmt);
  const lg=$('#chartLegend');if(lg)lg.innerHTML=legend.join('');
}

/* ---------- 归档 ---------- */
function addSnapshot(rep){
  snapshots.unshift({id:Date.now()+''+Math.floor(Math.random()*1000),
    type:rep.type,key:rep.key,title:rep.title,createdAt:new Date().toLocaleString('zh-CN'),
    rep:JSON.parse(JSON.stringify(rep))});
  if(snapshots.length>60)snapshots.length=60;
  saveSnaps();toast('已存入归档');
}
function renderArchive(c){
  if(!snapshots.length){
    c.innerHTML=`<div class="card"><div class="empty"><div class="big">🗂️</div>
      <p>归档还是空的。在日报 / 周报 / 月报页面点「存入归档」，即可保存当期报告快照。</p></div></div>`;
    return;
  }
  let html='<div class="card"><h3>已归档报告 <span class="sub">最多保留 60 份，保存在本机</span></h3>';
  for(const s of snapshots){
    const tn=s.type==='daily'?'日报':s.type==='weekly'?'周报':s.type==='monthly'?'月报':'年报';
    html+=`<div class="snap-item">
      <span class="badge ${s.type}">${tn}</span>
      <div class="info"><div class="t">${esc(s.title)}</div>
        <div class="m">归档于 ${esc(s.createdAt)} · ${s.rep.kpis.length} 项指标</div></div>
      <button class="btn" data-view-snap="${s.id}">查看</button>
      <button class="btn danger" data-del-snap="${s.id}">删除</button>
    </div>`;
  }
  html+='</div>';
  c.innerHTML=html;
  c.querySelectorAll('[data-view-snap]').forEach(b=>b.onclick=()=>{
    const s=snapshots.find(x=>x.id===b.dataset.viewSnap);
    if(s)renderReportView(c,s);
  });
  c.querySelectorAll('[data-del-snap]').forEach(b=>b.onclick=()=>{
    snapshots=snapshots.filter(x=>x.id!==b.dataset.delSnap);
    saveSnaps();renderArchive(c);toast('已删除');
  });
}

        const found=rows.find(r=>r.date===date);
        if(found){for(const k in values)found.values[k]=values[k];}
        else rows.push({date,values});
        rows.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
        const payload={rows,columns:state.columns,config:state.config,sourceName:state.sourceName||'营销发展日报.db',updatedAt:Date.now()};
        const enc=await encryptSnapshot(payload,pw);
        const text=`/* 自动生成 ${new Date().toISOString()} | 🔐 加密快照 | ${payload.rows.length} 天 ${payload.columns.length} 项指标 | 来源：线上填报 */\nwindow.ENCRYPTED_DATA=${JSON.stringify(enc)};`;
        btn.textContent='推送到 GitHub…';
        const bytes=new TextEncoder().encode(text);let bin='';
        for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
        const ghq=`https://api.github.com/repos/${GH_REPO}/contents/${GH_DATA_PATH}`;
        const hr={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json','Content-Type':'application/json'};
        const gr=await fetch(ghq+'?ref='+GH_BRANCH,{headers:hr});
        if(!gr.ok)throw new Error('读取文件信息失败（'+gr.status+'，检查 Token 权限）');
        const sha=(await gr.json()).sha;
        const pr=await fetch(ghq,{method:'PUT',headers:hr,body:JSON.stringify({message:'线上填报 '+date+'（'+n+' 项指标）',content:btoa(bin),sha,branch:GH_BRANCH})});
        if(!pr.ok){const ej=await pr.json().catch(()=>({}));throw new Error((ej&&ej.message)||('提交失败（'+pr.status+'）'));}
        localStorage.setItem(LS_GHTOKEN,tk);
        try{sessionStorage.setItem(SS_PW,pw);}catch(e){}
        toast('✅ 已提交，线上约 1-3 分钟后自动更新（可 Cmd+Shift+R 刷新查看）');
      }catch(e){toast('提交失败：'+(e&&e.message||e));}
      finally{btn.disabled=false;btn.textContent='🚀 提交并自动部署';}
    };
  }
  const scb=$('#saveCfgBtn');
  if(scb)scb.onclick=()=>{
    c.querySelectorAll('[data-cfg]').forEach(el=>{
      const col=el.dataset.cfg,f=el.dataset.f;
      if(!state.config[col])state.config[col]=guessCfg(col);
      state.config[col][f]=(f==='invert'||f==='core')?el.checked:el.value;
    });
    saveState();toast('设置已保存');render();
  };
}

/* ---------- 路由 ---------- */
window.switchView=function(v){curView=v;curPeriod=null;
  /* 同步 MOD_VIEW：点击报表/数据等按钮时切回对应的模块 tab */
  if(v==='product')MOD_VIEW='product';
  else if(v==='finance')MOD_VIEW='finance';
  else if(v==='channels')MOD_VIEW='channels';
  else if(v==='supply')MOD_VIEW='supply';
  else if(['daily','weekly','monthly','yearly','archive','data'].includes(v))MOD_VIEW='dashboard';
  else if(v==='dashboard')MOD_VIEW='dashboard';
  else MOD_VIEW='dashboard';
  render();};
const bindNav=(id,v)=>{const b=$('#'+id);if(b)b.onclick=()=>switchView(v);};
bindNav('navReport','daily');bindNav('navFinance','finance');bindNav('navProduct','product');bindNav('navArchive','archive');bindNav('navData','data');bindNav('navEntry','data');
/* 模块顶栏点击 → 切到对应模块 + 默认子视图 */
document.addEventListener('click',e=>{
  const a=e.target.closest('#modnav a');
  if(!a)return;
  const m=a.dataset.mod;
  if(m==='dashboard'){curView='dashboard';MOD_VIEW='dashboard';}
  else if(m==='channels'){curView='channels';MOD_VIEW='channels';}
  else if(m==='product'){curView='product';MOD_VIEW='product';}
  else if(m==='supply'){curView='supply';MOD_VIEW='supply';}
  else if(m==='finance'){curView='finance';MOD_VIEW='finance';}
  curPeriod=null;render();
});
window.addEventListener('resize',()=>{
  if(['daily','weekly','monthly','yearly'].includes(curView)){
    const list=periodsOf(curView);
    if(curPeriod&&list.includes(curPeriod)){const rep=buildReport(curView,curPeriod);drawChart(rep);}
  }
});

/* ---------- 自动同步：本地报告服务在线时，Excel 一变报告自动刷新 ---------- */
function autoSyncNow(quiet){
  if(!isLocal())return;   // 仅本地服务可用
  fetch('/data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
    if(!d||!d.rows||!d.rows.length)return;
    if(!d.ok&&!d.updatedAt)return;                  // 服务端还没解析出任何数据
    const serverAt=d.updatedAt||0;
    if(serverAt<=+(state.dataUpdatedAt||0))return;  // 没有更新的数据
    const prevLatest=state.rows.length?state.rows[state.rows.length-1].date:null;
    state.rows=d.rows;state.columns=d.columns;
    state.config=d.config||{};
    for(const col of state.columns)if(!state.config[col])state.config[col]=guessCfg(col);
    state.sourceName=d.sourceName||'营销发展日报.xlsx（自动同步）';
    state.dataUpdatedAt=serverAt;
    state.lastImportAt=(d.updatedHuman||new Date(serverAt).toLocaleString('zh-CN'))+'（自动）';
    if(!chartMetric||!state.columns.includes(chartMetric))
      chartMetric=state.columns.includes('总收入')?'总收入':state.columns[0];
    const archived=autoArchiveNewDays(d.today||d2s(new Date()));
    if(curPeriod&&curPeriod===prevLatest)curPeriod=null;  // 用户停在旧「最新一期」时跟随到最新
    saveState();render();
    if(archived.length)toast('已自动归档日报：'+archived.join('、'));
    else if(!quiet)toast('数据已自动更新');
  }).catch(()=>{});
}
function autoArchiveNewDays(todayStr){
  // 首次同步只建立基线（历史日期不回溯归档）；之后每个「已成型的昨天及更早」的日期自动归档日报
  if(!state.autoArchived){
    state.autoArchived=state.rows.map(r=>r.date);
    return [];
  }
  const known=new Set(state.autoArchived);
  const archived=[];
  for(const r of state.rows){
    const k=r.date;
    if(k>=todayStr)continue;          // 今天的数据还没定型，明天同步时再归档
    if(known.has(k))continue;
    const rep=buildReport('daily',k);
    if(rep&&rep.hasData){addSnapshot(rep);archived.push(k);}
    known.add(k);
  }
  state.autoArchived=[...known].sort().slice(-400);
  if(archived.length)saveSnaps();
  return archived;
}
setInterval(()=>autoSyncNow(false),30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoSyncNow(true);});

boot();
render();
autoSyncNow(true);
</script>
